<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game IDE</title>
    <!-- Updated to Pyodide 0.26.2 for better pygame support -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        body { 
            background: #1e1e1e; 
            color: #eee; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        
        /* Header */
        header { 
            background: #252526; 
            padding: 10px 20px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 50px;
        }
        h1 { margin: 0; font-size: 18px; color: #ce3c3c; }
        
        /* Main Layout */
        .container { display: flex; flex: 1; height: calc(100vh - 90px); }
        
        /* Left Column: Code Editor */
        .editor-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid #333; 
            background: #1e1e1e;
        }
        .pane-header { 
            background: #2d2d2d; 
            padding: 5px 15px; 
            font-size: 12px; 
            text-transform: uppercase; 
            color: #aaa; 
            border-bottom: 1px solid #333;
        }
        textarea { 
            flex: 1; 
            background: #1e1e1e; 
            color: #d4d4d4; 
            font-family: 'Consolas', 'Courier New', monospace; 
            padding: 15px; 
            border: none; 
            font-size: 14px; 
            line-height: 1.5; 
            resize: none; 
            outline: none;
        }
        
        /* Right Column: Game & Controls */
        .game-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #252526; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 20px;
        }
        
        canvas { 
            border: 2px solid #444; 
            background: #000; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            /* Ensure canvas doesn't stretch weirdly */
            max-width: 100%; 
        }

        /* Controls Area */
        .controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 10px; 
            align-items: center;
            background: #333;
            padding: 10px;
            border-radius: 5px;
        }
        
        button { 
            background: #ce3c3c; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            cursor: pointer; 
            border-radius: 3px; 
            font-weight: bold; 
        }
        button:hover { background: #ff4d4d; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        input[type="file"] { 
            color: #aaa; 
            font-size: 12px; 
        }

        /* Console Output */
        .console { 
            height: 40px; 
            background: #000; 
            color: #0f0; 
            font-family: monospace; 
            padding: 5px 15px; 
            font-size: 12px; 
            border-top: 1px solid #333;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<header>
    <h1>🎮 My Game IDE</h1>
    <div id="status" style="font-size: 12px; color: #888;">Loading Engine...</div>
</header>

<div class="container">
    <!-- LEFT: Code Editor -->
    <div class="editor-pane">
        <div class="pane-header">main.py</div>
        <textarea id="code-editor" spellcheck="false">
import pygame
import asyncio
import sys

async def main():
    pygame.init()
    screen = pygame.display.set_mode((400, 300))
    pygame.display.set_caption("My Game")
    
    # Try to load an image if it exists, otherwise use a rectangle
    try:
        # Look for 'player.png' in the virtual file system
        player_img = pygame.image.load('player.png')
        player_img = pygame.transform.scale(player_img, (50, 50))
        use_image = True
    except:
        use_image = False

    x, y = 175, 125
    clock = pygame.time.Clock()
    running = True
    
    print("Game Started! Use Arrow Keys to move.")

    while running:
        # 1. Events
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False
            elif event.type == pygame.KEYDOWN:
                if event.key == pygame.K_ESCAPE:
                    running = False

        # 2. Input Handling
        keys = pygame.key.get_pressed()
        if keys[pygame.K_LEFT]: x -= 5
        if keys[pygame.K_RIGHT]: x += 5
        if keys[pygame.K_UP]: y -= 5
        if keys[pygame.K_DOWN]: y += 5

        # Keep player on screen
        x = max(0, min(350, x))
        y = max(0, min(250, y))

        # 3. Draw
        screen.fill((30, 30, 30)) # Dark grey background
        
        if use_image:
            screen.blit(player_img, (x, y))
        else:
            pygame.draw.rect(screen, (0, 255, 0), (x, y, 50, 50))
            
        pygame.display.flip()
        
        # CRITICAL: Yield to browser
        await asyncio.sleep(0)
        
    print("Game Over.")

asyncio.ensure_future(main())
</textarea>
    </div>

    <!-- RIGHT: Game Canvas & Controls -->
    <div class="game-pane">
        <canvas id="canvas" width="400" height="300" tabindex="1"></canvas>
        
        <div class="controls">
            <button id="run-btn" onclick="runGame()" disabled>▶ Run</button>
            <button id="stop-btn" onclick="stopGame()" disabled style="background:#444;">⏹ Stop</button>
            
            <!-- Image Upload -->
            <div style="border-left: 1px solid #555; padding-left: 10px; margin-left: 10px;">
                <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:5px;">Upload Player Sprite:</label>
                <input type="file" id="img-upload" accept="image/*" onchange="handleImageUpload(this)">
            </div>
        </div>
    </div>
</div>

<div class="console" id="console">System initializing...</div>

<script>
    let pyodide;
    let isRunning = false;

    // 1. Initialize Pyodide
    async function init() {
        const status = document.getElementById('status');
        const consoleDiv = document.getElementById('console');
        
        try {
            pyodide = await loadPyodide();
            status.innerText = "Loading pygame...";
            
            // Load pygame package
            await pyodide.loadPackage("pygame");
            
            // Link canvas
            pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
            
            // Setup stdout capture
            pyodide.setStdout({ batched: (msg) => {
                consoleDiv.innerText = msg;
            }});
            
            status.innerText = "✅ Ready";
            document.getElementById('run-btn').disabled = false;
            consoleDiv.innerText = "Engine Ready. Upload an image or click Run.";
        } catch (err) {
            status.innerText = "❌ Error";
            consoleDiv.innerText = "Failed to load: " + err;
            console.error(err);
        }
    }

    // 2. Handle Image Upload
    async function handleImageUpload(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const uint8Array = new Uint8Array(arrayBuffer);
                
                // Write the file to Pyodide's virtual file system as 'player.png'
                // We assume PNG for simplicity, but pygame handles most formats
                pyodide.FS.writeFile('player.png', uint8Array);
                
                document.getElementById('console').innerText = `✅ Uploaded ${file.name} as 'player.png'`;
            };
            
            reader.readAsArrayBuffer(file);
        }
    }

    // 3. Run Game
    async function runGame() {
        if (isRunning) return;
        
        const consoleDiv = document.getElementById('console');
        consoleDiv.innerText = "Starting game...";
        document.getElementById('canvas').focus(); // Focus for keyboard input
        
        const code = document.getElementById('code-editor').value;
        
        try {
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
            
            // Run the user's code
            await pyodide.runPythonAsync(code);
            
        } catch (err) {
            consoleDiv.innerText = "❌ Error: " + err;
            isRunning = false;
            document.getElementById('run-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
        }
    }

    // 4. Stop Game (Simple Reload of Logic)
    function stopGame() {
        // In Pyodide, stopping an async loop is hard. 
        // We just reset the UI state here.
        document.getElementById('console').innerText = "Stopped. Click Run to restart.";
        document.getElementById('run-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
        isRunning = false;
        
        // Clear canvas
        const ctx = document.getElementById('canvas').getContext('2d');
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 400, 300);
    }

    // Start initialization
    init();
</script>

</body>
</html>
