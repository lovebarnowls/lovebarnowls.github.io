<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        #canvas { border: 2px solid #555; background: #000; width: 400px; height: 300px; }
        body { background: #222; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <h2>Sentinel Game Engine POC</h2>
    <canvas id="canvas" width="400" height="300"></canvas>
    <button id="run-btn" onclick="runGame()" disabled>Loading Engine...</button>

    <script>
        let pyodide;

        async function init() {
            pyodide = await loadPyodide();
            // Load pygame-ce (the browser-optimized version)
            await pyodide.loadPackage("pygame-ce");
            
            // Link the canvas
            pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
            
            document.getElementById('run-btn').disabled = false;
            document.getElementById('run-btn').innerText = "▶ Run Game";
        }

        async function runGame() {
            const code = `
import pygame
import asyncio

async def main():
    pygame.init()
    screen = pygame.display.set_mode((400, 300))
    
    x = 0
    running = True
    while running:
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False

        x = (x + 5) % 400
        
        screen.fill((0, 0, 0))
        pygame.draw.rect(screen, (255, 0, 0), (x, 130, 40, 40))
        pygame.display.flip()
        
        # This gives control back to the browser to render
        await asyncio.sleep(0)

# This starts the async loop
asyncio.ensure_future(main())
`;
            await pyodide.runPythonAsync(code);
        }

        init();
    </script>
</body>
</html>
