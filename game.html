<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel Game Engine POC</title>
    <!-- Using Pyodide 0.25.0 -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { 
            background: #222; 
            color: #eee; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 10px; color: #ce3c3c; }
        .container { position: relative; }
        canvas { 
            border: 2px solid #555; 
            background: #000; 
            width: 400px; 
            height: 300px; 
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button { 
            background: #ce3c3c; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 14px;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #ff4d4d; }
        #status { margin-top: 10px; font-size: 12px; color: #888; height: 20px; }
        #error-log { 
            color: #ff6b6b; 
            font-family: monospace; 
            font-size: 12px; 
            margin-top: 10px; 
            white-space: pre-wrap; 
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h2>🎮 Sentinel Game Engine</h2>
    
    <div class="container">
        <!-- tabindex="1" allows the canvas to receive keyboard focus -->
        <canvas id="canvas" width="400" height="300" tabindex="1"></canvas>
    </div>

    <div class="controls">
        <button id="run-btn" onclick="runGame()" disabled>Loading Engine...</button>
        <button id="stop-btn" onclick="stopGame()" disabled style="background:#444;">⏹ Stop</button>
    </div>

    <div id="status">Initializing Pyodide...</div>
    <div id="error-log"></div>

    <script>
        let pyodide;
        let isRunning = false;

        async function init() {
            const status = document.getElementById('status');
            try {
                // 1. Load Pyodide
                pyodide = await loadPyodide();
                status.innerText = "Loading pygame (this may take a moment)...";
                
                // 2. Load standard pygame (NOT pygame-ce)
                await pyodide.loadPackage("pygame");
                
                // 3. Link the canvas to Pyodide's display system
                pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
                
                status.innerText = "✅ Engine Ready. Click 'Run Game' to start.";
                document.getElementById('run-btn').disabled = false;
                document.getElementById('run-btn').innerText = "▶ Run Game";
            } catch (err) {
                status.innerText = "❌ Failed to load engine.";
                document.getElementById('error-log').innerText = err;
                console.error(err);
            }
        }

        async function stopGame() {
            // Simple stop: disable buttons and clear status
            // Note: Stopping an async loop in Pyodide cleanly is complex.
            // For this POC, we just prevent new runs.
            document.getElementById('status').innerText = "⏹ Game Stopped. Refresh page to reset fully.";
            document.getElementById('run-btn').disabled = true;
            document.getElementById('stop-btn').disabled = true;
            
            // Clear canvas visually
            const ctx = document.getElementById('canvas').getContext('2d');
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, 400, 300);
        }

        async function runGame() {
            if (isRunning) {
                alert("Game is already running! Please refresh to restart.");
                return;
            }
            
            const status = document.getElementById('status');
            const errorLog = document.getElementById('error-log');
            errorLog.innerText = ""; 
            status.innerText = "🚀 Starting Game Loop...";
            
            // Focus the canvas so it can receive keyboard events
            document.getElementById('canvas').focus();

            // The Python Code to Run
            const code = `
import pygame
import asyncio
import sys

# Global flag to allow stopping (optional for advanced use)
game_running = True

async def main():
    global game_running
    
    try:
        pygame.init()
        screen = pygame.display.set_mode((400, 300))
        clock = pygame.time.Clock()
        
        x = 0
        running = True
        
        while running and game_running:
            # 1. Handle Events
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False
                elif event.type == pygame.KEYDOWN:
                    if event.key == pygame.K_ESCAPE:
                        running = False

            # 2. Update Logic
            x = (x + 5) % 400
            
            # 3. Draw
            screen.fill((0, 0, 0))
            pygame.draw.rect(screen, (255, 0, 0), (x, 130, 40, 40))
            pygame.display.flip()
            
            # 4. Yield control to browser (CRITICAL for Pyodide)
            # This prevents the browser from freezing
            await asyncio.sleep(0)
            
        print("Game Loop Ended.")
        
    except Exception as e:
        print(f"Python Error: {e}")
        raise e

# Start the async task
asyncio.ensure_future(main())
`;

            try {
                isRunning = true;
                document.getElementById('stop-btn').disabled = false;
                await pyodide.runPythonAsync(code);
            } catch (err) {
                status.innerText = "❌ Runtime Error";
                errorLog.innerText = err;
                isRunning = false;
                document.getElementById('stop-btn').disabled = true;
            }
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
