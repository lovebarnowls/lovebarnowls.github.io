<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sen Game IDE</title>
    <!-- OFFICIAL STABLE PYODIDE -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { 
            background: #1e1e1e; 
            color: #eee; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        header { 
            background: #252526; 
            padding: 10px 20px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 50px;
        }
        h1 { margin: 0; font-size: 18px; color: #ce3c3c; }
        
        .container { display: flex; flex: 1; height: calc(100vh -90px); }
        
        .editor-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid #333; 
            background: #1e1e1e;
        }
        .pane-header { 
            background: #2d2d2d; 
            padding: 5px 15px; 
            font-size: 12px; 
            text-transform: uppercase; 
            color: #aaa; 
            border-bottom: 1px solid #333;
        }
        textarea { 
            flex: 1; 
            background: #1e1e1e; 
            color: #d4d4d4; 
            font-family: 'Consolas', monospace; 
            padding: 15px; 
            border: none; 
            font-size: 14px; 
            line-height: 1.5; 
            resize: none; 
            outline: none;
        }
        
        .game-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #252526; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 20px;
        }
        
        canvas { 
            border: 2px solid #444; 
            background: #000; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 10px; 
            align-items: center;
            background: #333;
            padding: 10px;
            border-radius: 5px;
        }
        
        button { 
            background: #ce3c3c; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            cursor: pointer; 
            border-radius: 3px; 
            font-weight: bold; 
        }
        button:hover { background: #ff4d4d; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        input[type="file"] { color: #aaa; font-size: 12px; }

        .console { 
            height: 40px; 
            background: #000; 
            color: #0f0; 
            font-family: monospace; 
            padding: 5px 15px; 
            font-size: 12px; 
            border-top: 1px solid #333;
            overflow-y: auto;
        }
        
        /* Loading Overlay */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 999;
        }
        .spinner {
            border: 4px solid #333; border-top: 4px solid #ce3c3c;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text" style="color:white; margin-top:20px;">Initializing Python Engine...</p>
</div>

<header>
    <h1>🎮 Sentinel Game IDE</h1>
    <div id="status" style="font-size: 12px; color: #888;">Ready</div>
</header>

<div class="container">
    <div class="editor-pane">
        <div class="pane-header">main.py</div>
        <textarea id="code-editor" spellcheck="false">
import pygame
import asyncio
import sys

async def main():
    pygame.init()
    screen = pygame.display.set_mode((400, 300))
    pygame.display.set_caption("My Game")
    
    # Try to load an image if it exists, otherwise use a rectangle
    try:
        player_img = pygame.image.load('player.png')
        player_img = pygame.transform.scale(player_img, (50, 50))
        use_image = True
    except:
        use_image = False

    x, y = 175, 125
    clock = pygame.time.Clock()
    running = True
    
    print("Game Started! Use Arrow Keys to move.")

    while running:
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False
            elif event.type == pygame.KEYDOWN:
                if event.key == pygame.K_ESCAPE:
                    running = False

        keys = pygame.key.get_pressed()
        if keys[pygame.K_LEFT]: x -= 5
        if keys[pygame.K_RIGHT]: x += 5
        if keys[pygame.K_UP]: y -= 5
        if keys[pygame.K_DOWN]: y += 5

        x = max(0, min(350, x))
        y = max(0, min(250, y))

        screen.fill((30, 30, 30))
        
        if use_image:
            screen.blit(player_img, (x, y))
        else:
            pygame.draw.rect(screen, (0, 255, 0), (x, y, 50, 50))
            
        pygame.display.flip()
        await asyncio.sleep(0)
        
    print("Game Over.")

asyncio.ensure_future(main())
</textarea>
    </div>

    <div class="game-pane">
        <canvas id="canvas" width="400" height="300" tabindex="1"></canvas>
        
        <div class="controls">
            <button id="run-btn" onclick="runGame()" disabled>▶ Run</button>
            <button id="stop-btn" onclick="stopGame()" disabled style="background:#444;">⏹ Stop</button>
            
            <div style="border-left: 1px solid #555; padding-left: 10px; margin-left: 10px;">
                <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:5px;">Upload Sprite:</label>
                <input type="file" id="img-upload" accept="image/*" onchange="handleImageUpload(this)">
            </div>
        </div>
    </div>
</div>

<div class="console" id="console">System initializing...</div>

<script>
    let pyodide;
    let isRunning = false;

    async function init() {
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const consoleDiv = document.getElementById('console');
        
        try {
            // 1. Load Pyodide
            pyodide = await loadPyodide();
            loadingText.innerText = "Downloading pygame (approx 10MB)...";
            
            // 2. Load pygame
            await pyodide.loadPackage("pygame");
            
            // 3. Link Canvas
            pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
            
            // 4. Setup Console
            pyodide.setStdout({ batched: (msg) => {
                consoleDiv.innerText = msg;
            }});
            
            // Hide loading screen
            loadingOverlay.style.display = 'none';
            document.getElementById('run-btn').disabled = false;
            consoleDiv.innerText = "✅ Engine Ready. Click Run.";
            
        } catch (err) {
            loadingText.innerText = "Error Loading Engine";
            consoleDiv.innerText = "❌ Failed: " + err;
            console.error(err);
        }
    }

    async function handleImageUpload(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const uint8Array = new Uint8Array(arrayBuffer);
                pyodide.FS.writeFile('player.png', uint8Array);
                document.getElementById('console').innerText = `✅ Uploaded ${file.name}`;
            };
            reader.readAsArrayBuffer(file);
        }
    }

    async function runGame() {
        if (isRunning) return;
        const consoleDiv = document.getElementById('console');
        consoleDiv.innerText = "Starting...";
        document.getElementById('canvas').focus();
        
        const code = document.getElementById('code-editor').value;
        
        try {
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
            await pyodide.runPythonAsync(code);
        } catch (err) {
            consoleDiv.innerText = "❌ Error: " + err;
            isRunning = false;
            document.getElementById('run-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
        }
    }

    function stopGame() {
        document.getElementById('console').innerText = "Stopped.";
        document.getElementById('run-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
        isRunning = false;
        const ctx = document.getElementById('canvas').getContext('2d');
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 400, 300);
    }

    init();
</script>

</body>
</html>
