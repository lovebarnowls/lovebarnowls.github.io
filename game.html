<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel Game IDE</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        body { background: #1e1e1e; color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #252526; padding: 10px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; height: 50px; }
        h1 { margin: 0; font-size: 18px; color: #ce3c3c; }
        .container { display: flex; flex: 1; height: calc(100vh - 90px); }
        .editor-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; background: #1e1e1e; }
        .pane-header { background: #2d2d2d; padding: 5px 15px; font-size: 12px; text-transform: uppercase; color: #aaa; border-bottom: 1px solid #333; }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; padding: 15px; border: none; font-size: 14px; line-height: 1.5; resize: none; outline: none; }
        .game-pane { flex: 1; display: flex; flex-direction: column; background: #252526; align-items: center; justify-content: flex-start; padding-top: 20px; }
        canvas { border: 2px solid #444; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .controls { margin-top: 20px; display: flex; gap: 10px; align-items: center; background: #333; padding: 10px; border-radius: 5px; }
        button { background: #ce3c3c; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        button:hover { background: #ff4d4d; }
        button:disabled { background: #555; cursor: not-allowed; }
        button.stop { background: #444; }
        button.stop:hover { background: #666; }
        input[type="file"] { color: #aaa; font-size: 12px; }
        .console { height: 40px; background: #000; color: #0f0; font-family: monospace; padding: 5px 15px; font-size: 12px; border-top: 1px solid #333; overflow-y: auto; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e1e1e; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .progress-bar { width: 300px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; background: #ce3c3c; width: 0%; transition: width 0.3s; }
        #loading-text { color: white; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div id="loading-screen">
    <h2 style="color:#ce3c3c;">🎮 Sentinel Engine</h2>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div id="loading-text">Initializing Python...</div>
</div>

<header>
    <h1>Sentinel Game IDE</h1>
    <div id="status" style="font-size: 12px; color: #888;">Ready</div>
</header>

<div class="container">
    <div class="editor-pane">
        <div class="pane-header">main.py</div>
        <textarea id="code-editor" spellcheck="false">
import pygame
import asyncio
from js import document

# Global flag to allow JS to stop the game
game_running = True

async def main():
    global game_running
    
    # Only init if not already initialized
    if not pygame.get_init():
        pygame.init()
        
    screen = pygame.display.set_mode((400, 300))
    pygame.display.set_caption("My Game")
    
    x, y = 200, 150
    game_running = True  # Reset flag on start
    print("Game Started! Use Arrow Keys.")

    while game_running:
        for event in pygame.event.get():
            if event.type == pygame.QUIT: 
                game_running = False
            elif event.type == pygame.KEYDOWN:
                if event.key == pygame.K_ESCAPE: 
                    game_running = False

        keys = pygame.key.get_pressed()
        if keys[pygame.K_LEFT]: x -= 5
        if keys[pygame.K_RIGHT]: x += 5
        if keys[pygame.K_UP]: y -= 5
        if keys[pygame.K_DOWN]: y += 5

        screen.fill((30, 30, 30))
        pygame.draw.rect(screen, (0, 255, 0), (x, y, 50, 50))
        pygame.display.flip()
        
        await asyncio.sleep(0)

    print("Game Ended.")

# Start the game
asyncio.ensure_future(main())
</textarea>
    </div>

    <div class="game-pane">
        <canvas id="canvas" width="400" height="300" tabindex="1"></canvas>
        <div class="controls">
            <button id="run-btn" onclick="runGame()">▶ Run</button>
            <button id="stop-btn" class="stop" onclick="stopGame()" disabled>⏹ Stop / Reset</button>
            <input type="file" id="img-upload" accept="image/*" onchange="handleImageUpload(this)">
        </div>
    </div>
</div>
<div class="console" id="console">Waiting for engine...</div>

<script>
    let pyodide;
    let currentTask = null;

    async function init() {
        const progress = document.getElementById('progress');
        const text = document.getElementById('loading-text');
        
        try {
            pyodide = await loadPyodide({
                indexURL : "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
            });
            progress.style.width = "30%";
            text.innerText = "Downloading pygame-ce...";
            
            await pyodide.loadPackage("pygame-ce");
            progress.style.width = "100%";
            
            pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
            
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('console').innerText = "✅ Engine Ready.";
            }, 500);
            
        } catch (err) {
            text.innerText = "Error: " + err.message;
            document.getElementById('console').innerText = "❌ Failed to load.";
        }
    }

    async function handleImageUpload(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const uint8Array = new Uint8Array(arrayBuffer);
                pyodide.FS.writeFile('player.png', uint8Array);
                document.getElementById('console').innerText = "✅ Image Uploaded.";
            };
            reader.readAsArrayBuffer(file);
        }
    }

    async function stopGame() {
        // 1. Set the Python flag to false to break the loop
        try {
            await pyodide.runPythonAsync("game_running = False");
        } catch (e) { console.log("Flag set error", e); }

        // 2. Clear Canvas visually immediately
        const ctx = document.getElementById('canvas').getContext('2d');
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 400, 300);

        // 3. Reset UI
        document.getElementById('console').innerText = "⏹ Stopped. Ready to Run.";
        document.getElementById('run-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
    }

    async function runGame() {
        // First, ensure we are stopped
        await stopGame();
        
        const consoleDiv = document.getElementById('console');
        consoleDiv.innerText = "Booting...";
        document.getElementById('canvas').focus();
        
        const code = document.getElementById('code-editor').value;
        
        // Update UI
        document.getElementById('run-btn').disabled = true;
        document.getElementById('stop-btn').disabled = false;

        try {
            // Run the user's code
            await pyodide.runPythonAsync(code);
            
        } catch (err) {
            consoleDiv.innerText = "❌ Error: " + err;
            document.getElementById('run-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
        }
    }

    init();
</script>

</body>
</html>
