<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Portal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    background: #1f1f1f;
    border: 1px solid #F0A500;
    border-radius: 12px;
    padding: 40px 44px;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    color: #F0A500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  p {
    font-size: 12px;
    color: #777;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    background: #111;
    border: 2px solid #2e2e2e;
    border-radius: 6px;
    color: #e0e0e0;
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s;
    text-align: center;
    letter-spacing: 2px;
  }
  input:focus { border-color: #F0A500; }
  button {
    background: #F0A500;
    color: #111;
    border: none;
    border-radius: 6px;
    padding: 10px 28px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
  }
  button:hover { background: #c98b00; }
  .err { font-size: 11px; color: #f05050; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<div class="box">
  <h1>⚑ Teacher Portal</h1>
  <p>Year 9 Digital Technologies — Submission Log</p>
  <input type="password" id="pw" placeholder="••••••••"
    onkeydown="if(event.key==='Enter') go()" autofocus />
  <button onclick="go()">View Logs →</button>
  <div class="err" id="err"></div>
</div>
<script>
  const LOG_URL = "https://formativeassessment.xu-yangen.workers.dev/view-logs";
  function go() {
    const pw = document.getElementById("pw").value.trim();
    if (!pw) { document.getElementById("err").textContent = "Enter a password."; return; }
    window.location.href = LOG_URL + "?password=" + encodeURIComponent(pw);
  }
</script>
</body>
</html>
