<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Test</title>
<style>
  body { background: #161616; color: #e0e0e0; font-family: monospace; padding: 20px; }
  textarea { width: 100%; height: 80px; background: #111; color: #d4d4d4; border: 1px solid #444; padding: 10px; font-family: monospace; font-size: 13px; resize: vertical; }
  button { background: #F0A500; color: #161616; border: none; padding: 8px 20px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  button:hover { background: #c98b00; }
  #results { margin-top: 16px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { background: #2D4A7A; color: #fff; padding: 6px 12px; text-align: left; border: 1px solid #333; }
  td { padding: 6px 12px; border: 1px solid #333; }
  tr:nth-child(even) td { background: #1a1a1a; }
  .err { color: #f05050; }
  .info { color: #5ab4f0; }
</style>
</head>
<body>

<h2 style="color:#F0A500;">SA Database — Test Interface</h2>
<p style="color:#888; font-size:12px;">Semicolon is automatically added to the end</p>

<textarea id="query" placeholder="SELECT * FROM students LIMIT 5"></textarea>
<br>
<button onclick="runQuery()">▶ Run Query</button>

<div id="results"><p class="info">Enter a query and click Run.</p></div>

<script>
const WORKER = "https://shiny-sea-e2f9.xu-yangen.workers.dev/";

async function runQuery() {
  const query = document.getElementById("query").value.trim().replace(/;+$/, "");
  const results = document.getElementById("results");
  if (!query) return;

  results.innerHTML = '<p class="info">Running...</p>';

  try {
    const resp = await fetch(WORKER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });
    const data = await resp.json();

    if (data.success) {
      if (!data.data || data.data.length === 0) {
        results.innerHTML = '<p class="info">Query returned no rows.</p>';
        return;
      }
      const cols = Object.keys(data.data[0]);
      let html = '<table><thead><tr>';
      cols.forEach(c => html += `<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      data.data.forEach(row => {
        html += '<tr>';
        cols.forEach(c => html += `<td>${row[c] === null ? 'NULL' : row[c]}</td>`);
        html += '</tr>';
      });
      html += '</tbody></table>';
      html += `<p class="info" style="margin-top:8px;">${data.data.length} row(s) returned.</p>`;
      results.innerHTML = html;
    } else {
      results.innerHTML = `<p class="err">✗ ${data.error}</p>`;
    }
  } catch (err) {
    results.innerHTML = `<p class="err">✗ Network error: ${err.message}</p>`;
  }
}

document.getElementById("query").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runQuery();
});
</script>
</body>
</html>
