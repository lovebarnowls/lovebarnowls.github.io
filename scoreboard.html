<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 9 DigiTech — Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── VARIABLES ───────────────────────────────────────────────────────────── */
:root {
  --bg:      #0a0a0a;
  --panel:   #111;
  --border:  #1e1e1e;
  --border2: #2a2a2a;
  --accent:  #F0A500;
  --accent2: #c98b00;
  --green:   #4ec94e;
  --red:     #f05050;
  --blue:    #5ab4f0;
  --purple:  #a855f7;
  --text:    #e0e0e0;
  --dim:     #555;
  --mono:    'Space Mono', monospace;
  --head:    'Unbounded', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow-x: hidden; }

/* ── SCANLINE OVERLAY ────────────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
}

/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
.page { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.site-header { text-align: center; margin-bottom: 40px; }
.site-header .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
.site-header h1 {
  font-family: var(--head);
  font-size: clamp(22px, 5vw, 38px);
  font-weight: 900;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: -1px;
  line-height: 1;
  margin-bottom: 6px;
}
.site-header .sub { font-size: 11px; color: var(--dim); letter-spacing: 2px; }

/* ── SCORE DISPLAY ───────────────────────────────────────────────────────── */
.score-wrap { text-align: center; margin-bottom: 36px; position: relative; }
.score-label { font-size: 10px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; }
.score-number {
  font-family: var(--head);
  font-size: clamp(64px, 16vw, 112px);
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  transition: transform 0.15s, color 0.15s;
  display: inline-block;
}
.score-number.bump { animation: bump 0.4s ease; }
@keyframes bump {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.12); color: #fff; }
  100% { transform: scale(1); }
}
.score-pts { font-size: 13px; color: var(--dim); margin-top: 4px; }

/* ── STREAK ──────────────────────────────────────────────────────────────── */
.streak-bar {
  display: flex; justify-content: center; gap: 6px;
  margin-bottom: 32px; flex-wrap: wrap;
}
.streak-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border2);
  transition: background 0.3s, transform 0.3s;
}
.streak-dot.lit { background: var(--accent); transform: scale(1.3); }

/* ── INPUT ───────────────────────────────────────────────────────────────── */
.input-row {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.flag-input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.15s;
  letter-spacing: 1px;
}
.flag-input:focus { border-color: var(--accent); }
.flag-input::placeholder { color: var(--dim); }
.submit-btn {
  background: var(--accent);
  color: #0a0a0a;
  border: none;
  border-radius: 6px;
  padding: 12px 20px;
  font-family: var(--head);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}
.submit-btn:hover { background: var(--accent2); }
.submit-btn:active { transform: scale(0.97); }

.feedback { font-size: 11px; min-height: 18px; margin-bottom: 20px; letter-spacing: 1px; }
.feedback.ok   { color: var(--green); }
.feedback.err  { color: var(--red); }
.feedback.warn { color: var(--accent); }

/* ── EARNED FLAGS ────────────────────────────────────────────────────────── */
.section-label {
  font-size: 9px; letter-spacing: 3px; color: var(--dim);
  text-transform: uppercase; margin-bottom: 12px;
  border-bottom: 1px solid var(--border2); padding-bottom: 6px;
}

.flags-grid {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 32px;
}
.flag-entry {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 10px 14px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: translateX(0); }
}
.flag-module {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  padding: 2px 8px; border-radius: 99px; font-weight: 700; white-space: nowrap;
}
.flag-module.sql      { background: #1a2e1a; color: var(--green); }
.flag-module.turtle   { background: #1a1a2e; color: var(--blue); }
.flag-module.pygame   { background: #2e1a1a; color: var(--red); }
.flag-module.ctf      { background: #2a1a2e; color: var(--purple); }
.flag-module.ext      { background: #1e1e1e; color: var(--dim); }
.flag-name { flex: 1; font-size: 12px; color: var(--text); }
.flag-pts  { font-family: var(--head); font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.flag-pts.ext { color: var(--dim); font-size: 12px; }

.empty-state { text-align: center; padding: 32px; color: var(--dim); font-size: 12px; letter-spacing: 1px; }

/* ── RESET ───────────────────────────────────────────────────────────────── */
.reset-btn {
  display: block; margin: 0 auto;
  background: transparent; border: 1px solid var(--border2);
  color: var(--dim); font-family: var(--mono); font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 8px 20px; border-radius: 4px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.reset-btn:hover { border-color: var(--red); color: var(--red); }

/* ── CONFETTI ────────────────────────────────────────────────────────────── */
.confetti-piece {
  position: fixed; top: -10px; width: 8px; height: 8px;
  border-radius: 2px; pointer-events: none; z-index: 9999;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="eyebrow">Year 9 Digital Technologies</div>
    <h1>Scoreboard</h1>
    <div class="sub">Paste your flags below — this session only</div>
  </header>

  <div class="score-wrap">
    <div class="score-label">Total Score</div>
    <div class="score-number" id="score-display">0</div>
    <div class="score-pts" id="score-pts">flags collected: 0</div>
  </div>

  <div class="streak-bar" id="streak-bar"></div>

  <div class="input-row">
    <input type="text" class="flag-input" id="flag-input"
      placeholder="FCSDE{lab_name_xxxxxx}"
      onkeydown="if(event.key==='Enter') submitFlag()" />
    <button class="submit-btn" onclick="submitFlag()">Submit</button>
  </div>
  <div class="feedback" id="feedback"></div>

  <div class="section-label">Earned Flags</div>
  <div class="flags-grid" id="flags-grid">
    <div class="empty-state" id="empty-state">No flags yet. Get to work.</div>
  </div>

  <button class="reset-btn" onclick="resetSession()">↺ New Session</button>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// FLAG CONFIG
// Edit this to add / change flags.
// Each entry: { leet, label, module, points }
//   leet   = the part inside FCSDE{...} before the underscore and 6-char hash
//   label  = friendly name shown on the scoreboard
//   module = "sql" | "turtle" | "pygame" | "ctf" | "ext"
//   points = score value
//
// EXTENSION FLAGS: set points to a single digit (1-9) and module to "ext"
//
// TO ADD NEW FLAGS: copy a line, change leet/label/module/points, done.
// ════════════════════════════════════════════════════════════════════════════

const FLAG_CONFIG = [

  // ── SQL WEEK 1 (placeholder leet strings) ────────────────────────────────
  { leet: "w1_lab1",  label: "W1 · Lab 1 — Schema Discovery",   module: "sql", points: 300 },
  { leet: "w1_lab2",  label: "W1 · Lab 2 — Table Structure",     module: "sql", points: 280 },
  { leet: "w1_lab3",  label: "W1 · Lab 3 — SELECT *",            module: "sql", points: 260 },
  { leet: "w1_lab4",  label: "W1 · Lab 4 — Selecting Columns",   module: "sql", points: 240 },
  { leet: "w1_lab5",  label: "W1 · Lab 5 — WHERE (text)",        module: "sql", points: 220 },
  { leet: "w1_lab6",  label: "W1 · Lab 6 — Combining It All",    module: "sql", points: 200 },
  { leet: "w1_lab7",  label: "W1 · Lab 7 — Reading Data",        module: "sql", points: 180 },
  { leet: "w1_ext1",  label: "W1 · Ext 1 — Genre Filter",        module: "ext", points: 7   },
  { leet: "w1_ext2",  label: "W1 · Ext 2 — Empty Results",       module: "ext", points: 6   },
  { leet: "w1_ext3",  label: "W1 · Ext 3 — Comparisons",         module: "ext", points: 5   },
  { leet: "w1_ext4",  label: "W1 · Ext 4 — OR",                  module: "ext", points: 4   },
  { leet: "w1_ext5",  label: "W1 · Ext 5 — AND",                 module: "ext", points: 3   },
  { leet: "w1_ext6",  label: "W1 · Ext 6 — Putting It Together", module: "ext", points: 2   },

  // ── SQL WEEK 2 (placeholder) ─────────────────────────────────────────────
  { leet: "w2_lab1",  label: "W2 · Lab 1", module: "sql", points: 300 },
  { leet: "w2_lab2",  label: "W2 · Lab 2", module: "sql", points: 280 },
  { leet: "w2_lab3",  label: "W2 · Lab 3", module: "sql", points: 260 },
  { leet: "w2_lab4",  label: "W2 · Lab 4", module: "sql", points: 240 },
  { leet: "w2_lab5",  label: "W2 · Lab 5", module: "sql", points: 220 },
  { leet: "w2_lab6",  label: "W2 · Lab 6", module: "sql", points: 200 },

  // ── SQL WEEKS 3–12 (placeholder rows — replace leet strings with real ones)
  { leet: "w3_lab1",  label: "W3 · Lab 1", module: "sql", points: 300 },
  { leet: "w3_lab2",  label: "W3 · Lab 2", module: "sql", points: 280 },
  { leet: "w4_lab1",  label: "W4 · Lab 1", module: "sql", points: 300 },
  { leet: "w4_lab2",  label: "W4 · Lab 2", module: "sql", points: 280 },
  { leet: "w5_lab1",  label: "W5 · Lab 1", module: "sql", points: 300 },
  { leet: "w6_lab1",  label: "W6 · Lab 1", module: "sql", points: 300 },

  // ── TURTLE WEEK 1 (placeholder) ──────────────────────────────────────────
  { leet: "t1_lab1",  label: "Turtle W1 · Lab 1 — The Line",             module: "turtle", points: 300 },
  { leet: "t1_lab2",  label: "Turtle W1 · Lab 2 — Turning Left",         module: "turtle", points: 280 },
  { leet: "t1_lab3",  label: "Turtle W1 · Lab 3 — Consecutive Commands", module: "turtle", points: 260 },
  { leet: "t1_lab4",  label: "Turtle W1 · Lab 4 — Drawing an L",         module: "turtle", points: 240 },
  { leet: "t1_lab5",  label: "Turtle W1 · Lab 5 — Diagonals",            module: "turtle", points: 220 },
  { leet: "t1_lab6",  label: "Turtle W1 · Lab 6 — Pen Up Pen Down",      module: "turtle", points: 200 },
  { leet: "t1_ext1",  label: "Turtle W1 · Ext — 67 is SOOOO 2025",       module: "ext",    points: 7   },

  // ── PYGAME (placeholder) ─────────────────────────────────────────────────
  { leet: "pg1_lab1", label: "Pygame · Lab 1", module: "pygame", points: 300 },
  { leet: "pg1_lab2", label: "Pygame · Lab 2", module: "pygame", points: 280 },

  // ── CTF (placeholder — add real flags when unit is written) ──────────────
  { leet: "ctf1_lab1", label: "CTF · Lab 1", module: "ctf", points: 300 },
  { leet: "ctf1_lab2", label: "CTF · Lab 2", module: "ctf", points: 280 },

];

// ════════════════════════════════════════════════════════════════════════════
// ENGINE — do not edit below this line
// ════════════════════════════════════════════════════════════════════════════

// Build lookup: leet (lowercase) → config entry
const FLAG_LOOKUP = {};
FLAG_CONFIG.forEach(f => { FLAG_LOOKUP[f.leet.toLowerCase()] = f; });

let totalScore  = 0;
let flagsEarned = [];   // array of leet strings already submitted this session

function submitFlag() {
  const input   = document.getElementById("flag-input");
  const raw     = input.value.trim();
  const fb      = document.getElementById("feedback");

  if (!raw) { setFeedback("Paste a flag first.", "warn"); return; }

  // Parse FCSDE{leet_xxxxxx}
  const match = raw.match(/^FCSDE\{(.+)_([a-f0-9]{6})\}$/i);
  if (!match) {
    setFeedback("Not a valid flag format. Should look like FCSDE{name_a1b2c3}", "err");
    return;
  }

  const leet = match[1].toLowerCase();
  const hash = match[2].toLowerCase();  // stored but not validated client-side

  if (flagsEarned.includes(leet)) {
    setFeedback("Already submitted — no double dipping.", "warn");
    input.value = "";
    return;
  }

  const config = FLAG_LOOKUP[leet];
  if (!config) {
    setFeedback("Flag not recognised. Check you copied it correctly.", "err");
    return;
  }

  // Accept
  flagsEarned.push(leet);
  totalScore += config.points;
  input.value = "";

  addFlagRow(config);
  updateScore(config.points);
  updateStreak();
  setFeedback("+" + config.points + " pts — " + config.label, "ok");
  if (config.points >= 200) fireConfetti();
}

function addFlagRow(config) {
  const grid  = document.getElementById("flags-grid");
  const empty = document.getElementById("empty-state");
  if (empty) empty.remove();

  const row = document.createElement("div");
  row.className = "flag-entry";
  row.innerHTML =
    '<span class="flag-module ' + config.module + '">' + config.module.toUpperCase() + '</span>' +
    '<span class="flag-name">'  + config.label  + '</span>' +
    '<span class="flag-pts '    + (config.module === "ext" ? "ext" : "") + '">' +
    (config.module === "ext" ? "+" + config.points : config.points) +
    '</span>';
  grid.prepend(row);
}

function updateScore(added) {
  const el = document.getElementById("score-display");
  el.classList.remove("bump");
  void el.offsetWidth; // reflow to restart animation
  el.classList.add("bump");
  el.textContent = totalScore;
  document.getElementById("score-pts").textContent =
    "flags collected: " + flagsEarned.length;
}

function updateStreak() {
  const bar = document.getElementById("streak-bar");
  // Show up to 20 dots representing last 20 submissions
  const total = Math.min(flagsEarned.length, 20);
  bar.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const dot = document.createElement("div");
    dot.className = "streak-dot lit";
    bar.appendChild(dot);
  }
}

function setFeedback(msg, cls) {
  const fb = document.getElementById("feedback");
  fb.textContent = msg;
  fb.className   = "feedback " + cls;
  clearTimeout(fb._timer);
  fb._timer = setTimeout(() => { fb.textContent = ""; fb.className = "feedback"; }, 4000);
}

function fireConfetti() {
  const colours = ["#F0A500","#4ec94e","#5ab4f0","#f05050","#a855f7","#fff"];
  for (let i = 0; i < 48; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left     = Math.random() * 100 + "vw";
    el.style.background = colours[Math.floor(Math.random() * colours.length)];
    el.style.animationDuration = (1.2 + Math.random() * 1.6) + "s";
    el.style.animationDelay   = (Math.random() * 0.4) + "s";
    el.style.width  = (6 + Math.random() * 8) + "px";
    el.style.height = (6 + Math.random() * 8) + "px";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
}

function resetSession() {
  if (!confirm("Start a new session? Your current score will be cleared.")) return;
  totalScore  = 0;
  flagsEarned = [];
  document.getElementById("score-display").textContent = "0";
  document.getElementById("score-pts").textContent     = "flags collected: 0";
  document.getElementById("streak-bar").innerHTML      = "";
  document.getElementById("flags-grid").innerHTML      = '<div class="empty-state" id="empty-state">No flags yet. Get to work.</div>';
  document.getElementById("feedback").textContent      = "";
  document.getElementById("flag-input").value          = "";
}

document.getElementById("flag-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") submitFlag();
});
</script>
</body>
</html>
