<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project AI Adversary</title>
    <style>
        :root {
            --primary: #3498db;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --danger: #e74c3c;
            --success: #27ae60;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .config-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
        }
        .chat-container {
            border: 2px solid #ddd;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
        }
        .user-message {
            background-color: var(--dark);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #e9ecef;
            color: var(--dark);
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .guess-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
        }
        .status {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            min-height: 24px;
        }
        .mandatory-hint {
            font-size: 0.85em;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Project AI Adversary</h1>
    
    <!-- Configuration for Worker URL -->
    <div class="config-section">
        <label for="workerUrl"><strong>Target Worker URL:</strong></label>
        <input type="text" id="workerUrl" placeholder="https://your-team-worker.workers.dev" style="width: 100%; box-sizing: border-box;">
        <p style="font-size: 0.9em; color: #666;">Enter the Cloudflare Worker URL for the team you are attacking.</p>
    </div>

    <div class="mandatory-hint">
        ⚠️ Constraint: The AI is forced to include 5 specific associated words in every response
