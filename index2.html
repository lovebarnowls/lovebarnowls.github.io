<!DOCTYPE html>
<html>
<head>
    <title>FunWorld System Audit - PoC</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #1a1a1a; color: white; }
        #editor-container { width: 40%; display: flex; flex-direction: column; border-right: 2px solid #333; }
        #preview-container { width: 60%; background: #fff; display: flex; flex-direction: column; }
        header { background: #2d2d2d; padding: 15px; font-size: 14px; color: #00ff00; border-bottom: 1px solid #444; }
        textarea { flex-grow: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; padding: 20px; border: none; outline: none; font-size: 16px; resize: none; }
        iframe { width: 100%; height: 100%; border: none; }
        .status-bar { padding: 5px 15px; background: #333; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div id="editor-container">
        <header>
            <strong>FUNWORLD_TERMINAL // MISSION_0.1: THE_GATE</strong><br>
            [!] VULNERABILITY DETECTED: BROKEN_ACCESS_CONTROL
        </header>
        <textarea id="code-editor" spellcheck="false">
<div style="text-align: center; margin-top: 50px;">
    <h1>Welcome to FunWorld</h1>
    <p>Please click below to enter the park.</p>
    
    <button id="gate-button" disabled 
      style="padding: 15px 30px; font-size: 20px; cursor: pointer;">
      ENTER FUNWORLD
    </button>
</div>

<script>
    document.getElementById('gate-button').onclick = function() {
        alert('MISSION COMPLETE! TOKEN: FW-Y7-M0-G4TE');
    };
</script>
        </textarea>
        <div class="status-bar">UTF-8 | Line: 15 | HTML5</div>
    </div>

    <div id="preview-container">
        <iframe id="live-preview"></iframe>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const preview = document.getElementById('live-preview');

        function updatePreview() {
            const content = editor.value;
            const doc = preview.contentDocument || preview.contentWindow.document;
            doc.open();
            doc.write(content);
            doc.close();
        }

        editor.addEventListener('input', updatePreview);
        window.onload = updatePreview;
    </script>

</body>
</html>
