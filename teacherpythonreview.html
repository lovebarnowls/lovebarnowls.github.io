<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Python Review Portal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { background: #252526; border: 1px solid #4EC9B0; border-radius: 12px; padding: 40px 44px; max-width: 380px; width: 90%; text-align: center; }
  h1 { font-size: 15px; font-weight: 700; color: #4EC9B0; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  p { font-size: 12px; color: #666; margin-bottom: 24px; }
  input { width: 100%; background: #1e1e1e; border: 2px solid #333; border-radius: 6px; color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 15px; padding: 10px 14px; outline: none; margin-bottom: 16px; transition: border-color 0.15s; text-align: center; letter-spacing: 2px; }
  input:focus { border-color: #4EC9B0; }
  button { background: #4EC9B0; color: #1e1e1e; border: none; border-radius: 6px; padding: 10px 28px; font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; width: 100%; transition: background 0.15s; }
  button:hover { background: #3ab89f; }
  .err { font-size: 11px; color: #f05050; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<div class="box">
  <h1>🐢 Python Review Portal</h1>
  <p>Turtle · Pygame · Capstone · CTF</p>
  <input type="password" id="pw" placeholder="••••••••"
    onkeydown="if(event.key==='Enter') go()" autofocus />
  <button onclick="go()">View Submissions →</button>
  <div class="err" id="err"></div>
</div>
<script>
  const REVIEW_URL = "https://teacher-python-review.xu-yangen.workers.dev/view";
  function go() {
    const pw = document.getElementById("pw").value.trim();
    if (!pw) { document.getElementById("err").textContent = "Enter a password."; return; }
    window.location.href = REVIEW_URL + "?password=" + encodeURIComponent(pw);
  }
</script>
</body>
</html>
