<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa</title>
<style>
:root{--spruce:#0f2a22;--spruce2:#17382d;--snow:#fffaf2;--ink:#241a17;--mute:#6f625b;--cran:#b8283b;--gold:#e9b949;--line:#dccfbd;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--spruce);color:var(--snow);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:36px 18px 56px}
h1{font:700 2.4rem/1.1 Georgia,"Times New Roman",serif;margin:0 0 6px}
.sub{color:#b9cfc4;margin:0 0 24px}
.panel{background:var(--spruce2);border:1px solid #2b5545;border-radius:10px;padding:18px;margin-bottom:18px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:700 1.6rem ui-monospace,Consolas,monospace;letter-spacing:.25em;text-align:center;text-transform:uppercase;color:var(--ink);background:var(--snow);border:2px solid transparent;border-radius:6px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;background:var(--cran);color:#fff;margin-top:14px}
button.alt{background:transparent;color:var(--snow);border:2px solid #4b7a66}
button:disabled{opacity:.6;cursor:wait}
.err{color:#ffb4bd;margin:12px 0 0;min-height:1.2em}
.small{color:#9fb8ac;font-size:.88rem}
.tag{position:relative;background:var(--snow);color:var(--ink);padding:34px 24px 26px;margin:6px 0 0;clip-path:polygon(0 0,86% 0,100% 18%,100% 100%,0 100%);border-radius:4px}
.tag::before{content:"";position:absolute;top:12px;right:14%;width:14px;height:14px;border-radius:50%;background:var(--spruce);box-shadow:0 0 0 3px var(--gold)}
.tag small{color:var(--mute)}
.tag .who{font:700 2.6rem/1.1 Georgia,serif;color:var(--cran);margin:8px 0 0;word-break:break-word}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.tag{animation:drop .5s ease-out}@keyframes drop{from{transform:translateY(-14px) rotate(-2deg);opacity:0}}}
</style>
</head>
<body>
<main>
<h1>Secret Santa</h1>
<p class="sub">Taking part: Mark, Yang, Claire, Byrn, Marny, Tenika.</p>
<div class="panel">
  <label for="code">Your 4-character code</label>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="••••">
  <button id="go">Check my code</button>
  <p class="err" id="err" role="alert"></p>
</div>
<div id="out"></div>
<p class="small">Each code is unique to one person. Please do not share yours.</p>
</main>
<script id="d" type="application/json">{"s":"YNk7hx+YM+DozcY76RDQug==","e":[["vivLLahsxJu/Enmq","JNgs10SegnK1VRgVfIgGphiAHARpu4OT7yFFMRskDs28FckUQnuB04Y="],["SFZ199XQ11fnkHOI","snjbAi11/KPREf8xZG7s1da+Hh4miD7+LUH+wonOXvhkiho/cIgEC6bq"],["KoNuNbHJixyC5HAN","amR8U+hUe+PHxOfHPl4+8f+km72ElEkJHEju1wWR8caIphMYeL0diwRr"],["+OL72SLLOKh0vDmw","R/665TmHhuu3CP0R8GR6zijH3OwiFvarcMZ2/YG1WjxqR2csUV/s"],["Euj1LoeZeNVxrH75","zH7qaCN9FLsUSMeBPbpbISvzsk8G08TAKkJ+iTgnI5rgNWU2FAUmxpw="],["ICPQJniB+a39syJk","L7NFUSwzacNVlIhhvODZJQRtn7CdmqOuz1yRgengs6Y9rCnVLGhl"]]}</script>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DATA=JSON.parse($('#d').textContent);
async function tryCode(code){
  const k=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(DATA.s),iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const e of DATA.e){
    try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e[0])},key,unb64(e[1]));return JSON.parse(dec.decode(pt))}catch(x){}
  }
  return null;
}
async function go(){
  const err=$('#err'),btn=$('#go');err.textContent='';$('#out').innerHTML='';
  const code=$('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){err.textContent='A code has 4 letters or numbers. Please check it and try again.';return}
  if(!window.crypto||!crypto.subtle){err.textContent='This page must be opened from a secure (https) address.';return}
  btn.disabled=true;btn.textContent='Checking…';
  const m=await tryCode(code);
  btn.disabled=false;btn.textContent='Check my code';
  if(!m){err.textContent='That code was not recognised. Please check it and try again.';return}
  $('#out').innerHTML=`<div class="panel"><p style="margin:0">Hello, <b>${esc(m.g)}</b>. Your code is valid.</p><button id="show">Show who I am preparing for</button></div><div id="tag"></div>`;
  $('#show').onclick=()=>{
    $('#tag').innerHTML=`<div class="tag"><small>You are preparing something for</small><div class="who">${esc(m.r)}</div></div><button class="alt" id="hide">Hide this</button>`;
    $('#show').classList.add('hidden');
    $('#hide').onclick=()=>{$('#tag').innerHTML='';$('#show').classList.remove('hidden')};
  };
}
$('#go').onclick=go;
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
