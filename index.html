<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yang's Python Turtle IDE</title>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: #1e1e1e; }
        .header { height: 55px; background: #252526; color: white; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-bottom: 1px solid #333; }
        .logo { font-weight: bold; color: #4EC9B0; }
        .controls { display: flex; gap: 10px; }
        
        button { border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .btn-run { background-color: #28a745; color: white; }
        .btn-run:hover { background-color: #218838; }
        .btn-download { background-color: #3e3e3e; color: white; border: 1px solid #555; }
        .btn-download:hover { background-color: #505050; }

        .main-container { display: flex; height: calc(100% - 55px); width: 100vw; }
        #editor-container { width: 45%; height: 100%; display: flex; flex-direction: column; }
        #code-input { flex-grow: 1; background: #1e1e1e; color: #d4d4d4; padding: 20px; font-family: 'Consolas', monospace; font-size: 15px; border: none; outline: none; resize: none; }

        #output-container { width: 55%; height: 100%; display: flex; flex-direction: column; background-color: #fff; border-left: 2px solid #333; }
        #canvas-wrapper { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; background: #fff;}
        #my-canvas { width: 100%; height: 100%; }
        #console-output { height: 120px; background: #000; color: #00ff00; padding: 15px; font-family: monospace; font-size: 13px; overflow-y: auto; margin: 0; border-top: 2px solid #333; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Yang's Python Turtle IDE</div>
    <div class="controls">
        <button class="btn-run" onclick="runPython()">▶ RUN</button>
        <button class="btn-download" onclick="downloadScript()">💾 CODE</button>
        <button class="btn-download" onclick="downloadCanvas()">🖼 PNG</button>
    </div>
</div>

<div class="main-container">
    <div id="editor-container">
<textarea id="code-input" spellcheck="false">
import turtle

s = turtle.Screen()
s.bgcolor("navy")

t = turtle.Turtle()
t.color("white")
t.speed(0)

for i in range(36):
    t.forward(100)
    t.left(170)

print("Drawing Ready!")
</textarea>
    </div>

    <div id="output-container">
        <div id="canvas-wrapper">
            <div id="my-canvas"></div>
        </div>
        <pre id="console-output">Ready...</pre>
    </div>
</div>

<script type="text/javascript">
    function outf(text) {
        var mypre = document.getElementById("console-output");
        mypre.innerHTML += text;
        mypre.scrollTop = mypre.scrollHeight;
    }

    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
            throw "File not found: '" + x + "'";
        return Sk.builtinFiles["files"][x];
    }

    function runPython() {
        var program = document.getElementById("code-input").value;
        document.getElementById("console-output").innerHTML = ""; 
        document.getElementById("my-canvas").innerHTML = "";

        var wrapper = document.getElementById("canvas-wrapper");
        
        Sk.configure({ 
            output: outf, 
            read: builtinRead, 
            __future__: Sk.python3 
        });

        // CRITICAL FIX: Ensure the Turtle Graphics object is initialized with height/width
        // This is what allows bgcolor() to find the screen object.
        Sk.TurtleGraphics = { 
            target: 'my-canvas', 
            width: wrapper.offsetWidth, 
            height: wrapper.offsetHeight,
            assets: {
                // This ensures the canvas buffer is kept so we can save as PNG
                "preserveDrawingBuffer": true 
            }
        };

        var myPromise = Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>", false, program, true);
        });

        myPromise.then(function() { 
            console.log('Success'); 
        }, function(err) {
            outf("<span style='color:#ff5555'>" + err.toString() + "</span>");
        });
    }

    function downloadScript() {
        const blob = new Blob([document.getElementById("code-input").value], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "robotics_script.py";
        a.click();
    }

    function downloadCanvas() {
        // Skulpt creates an internal canvas. We need to find the one with the actual drawing.
        const canvases = document.querySelectorAll("#my-canvas canvas");
        // Usually the second canvas (index 1) holds the turtle drawing in Skulpt
        const targetCanvas = canvases.length > 1 ? canvases[1] : canvases[0];

        if (targetCanvas) {
            // Create a temporary canvas to merge the background color with the drawing
            // Otherwise, the PNG transparency might show as black/blank
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = targetCanvas.width;
            tempCanvas.height = targetCanvas.height;
            const ctx = tempCanvas.getContext("2d");

            // Fill background (optional, but ensures it's not transparent)
            ctx.fillStyle = "white"; 
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            
            // Draw the turtle canvas on top
            ctx.drawImage(targetCanvas, 0, 0);

            const image = tempCanvas.toDataURL("image/png");
            const a = document.createElement("a");
            a.href = image;
            a.download = "turtle_art.png";
            a.click();
        } else {
            alert("Please run your code first!");
        }
    }

    window.onload = runPython;
</script>

</body>
</html>
