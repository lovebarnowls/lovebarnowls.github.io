<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomorrow Robotics IDE - Turtle Edition</title>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #1e1e1e;
        }

        /* Header Area */
        .header {
            height: 50px;
            background: #2d2d2d;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            border-bottom: 1px solid #444;
        }

        .btn-run {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-run:hover { background-color: #45a049; }

        /* Split Screen Layout */
        .main-container {
            display: flex;
            height: calc(100% - 50px);
            width: 100vw;
        }

        /* Left Side: Code Editor */
        #editor-container {
            width: 50%;
            height: 100%;
            border-right: 2px solid #444;
        }

        #code-input {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border: none;
            outline: none;
            resize: none;
            box-sizing: border-box;
        }

        /* Right Side: Output & Turtle */
        #output-container {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: white;
        }

        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Console Output at bottom of right side */
        #console-output {
            height: 150px;
            background: #000;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            overflow-y: auto;
            border-top: 2px solid #444;
        }
    </style>
</head>
<body>

<div class="header">
    <strong>Tomorrow Robotics Sandbox</strong>
    <button class="btn-run" onclick="runPython()">▶ Run Code</button>
</div>

<div class="main-container">
    <div id="editor-container">
<textarea id="code-input" spellcheck="false">
import turtle

t = turtle.Turtle()
t.shape("turtle")
t.color("red")

for i in range(4):
    t.forward(100)
    t.left(90)

print("Drawing complete!")
</textarea>
    </div>

    <div id="output-container">
        <div id="canvas-wrapper">
            <div id="my-canvas"></div>
        </div>
        <pre id="console-output">Console output will appear here...</pre>
    </div>
</div>

<script type="text/javascript">
    // Helper to log text to the internal console
    function outf(text) {
        var mypre = document.getElementById("console-output");
        mypre.innerHTML = mypre.innerHTML + text;
    }

    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
            throw "File not found: '" + x + "'";
        return Sk.builtinFiles["files"][x];
    }

    function runPython() {
        var program = document.getElementById("code-input").value;
        var output = document.getElementById("console-output");
        output.innerHTML = ""; // Clear console
        
        // Reset Turtle Canvas
        document.getElementById("my-canvas").innerHTML = "";

        Sk.pre = "console-output";
        Sk.configure({
            output: outf,
            read: builtinRead,
            __future__: Sk.python3 // Use Python 3 syntax
        });

        // Tell Turtle to draw in our specific div
        (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'my-canvas';

        var myPromise = Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>", false, program, true);
        });

        myPromise.then(function(mod) {
            console.log('Success');
        }, function(err) {
            outf("<span style='color:red'>" + err.toString() + "</span>");
        });
    }

    // Run on startup to show initial turtle
    window.onload = runPython;
</script>

</body>
</html>
