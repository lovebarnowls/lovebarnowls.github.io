<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yang's Python Turtle IDE - Task 1</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: #1e1e1e; }
        .header { height: 50px; background: #252526; color: white; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-bottom: 1px solid #333; }
        
        /* TASK INSTRUCTION BOX */
        #task-box {
            background: #fff3cd; /* Warning yellow style */
            color: #856404;
            padding: 15px;
            border-bottom: 2px solid #ffeeba;
            font-size: 14px;
            line-height: 1.4;
        }

        .main-container { display: flex; height: calc(100% - 50px); width: 100vw; }
        #editor-container { width: 45%; height: 100%; display: flex; flex-direction: column; }
        #code-input { flex-grow: 1; background: #1e1e1e; color: #d4d4d4; padding: 20px; font-family: 'Consolas', monospace; font-size: 15px; border: none; outline: none; }

        #output-container { width: 55%; height: 100%; display: flex; flex-direction: column; background-color: #fff; }
        
        /* VISUAL GOAL / HINT AREA */
        #goal-reference {
            height: 120px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
        }
        #goal-img { height: 100px; border: 1px solid #ccc; margin-right: 15px; }

        #canvas-wrapper { flex-grow: 1; position: relative; }
        #my-canvas { width: 100%; height: 100%; }
        #console-output { height: 80px; background: #000; color: #00ff00; padding: 10px; font-family: monospace; overflow-y: auto; margin: 0; }
        
        button { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-run { background-color: #28a745; color: white; margin-left: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div style="color:#4EC9B0; font-weight:bold;">TASK 1: The Broken Square</div>
    <div>
        <button class="btn-run" onclick="runPython()">▶ TEST MY FIX</button>
    </div>
</div>

<div class="main-container">
    <div id="editor-container">
        <div id="task-box">
            <strong>Challenge:</strong> The code below is supposed to draw a <b>Red Square</b>. 
            However, it's drawing a triangle and the color is wrong. Can you fix it?
        </div>
<textarea id="code-input" spellcheck="false">
import turtle
t = turtle.Turtle()

# FIX ME: Change the color to "red"
t.color("blue")

# FIX ME: A square needs 4 sides, not 3!
for i in range(3):
    t.forward(100)
    t.left(90)
</textarea>
    </div>

    <div id="output-container">
        <div id="goal-reference">
            <img id="goal-img" src="https://via.placeholder.com/100?text=Red+Square" alt="Goal Image">
            <div>
                <strong>Goal:</strong> Your drawing should look like this.<br>
                <em>Hint: Check the loop range and the color string!</em>
            </div>
        </div>
        <div id="canvas-wrapper">
            <div id="my-canvas"></div>
        </div>
        <pre id="console-output"></pre>
    </div>
</div>

<script type="text/javascript">
    // (Insert the same Skulpt runPython and outf logic from previous version here)
    function outf(text) { var mypre = document.getElementById("console-output"); mypre.innerHTML += text; }
    function builtinRead(x) { if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found: '" + x + "'"; return Sk.builtinFiles["files"][x]; }

    function runPython() {
        var userCode = document.getElementById("code-input").value;
        document.getElementById("console-output").innerHTML = ""; 
        document.getElementById("my-canvas").innerHTML = "";
        var wrapper = document.getElementById("canvas-wrapper");
        
        Sk.configure({ output: outf, read: builtinRead, __future__: Sk.python3 });
        Sk.TurtleGraphics = { target: 'my-canvas', width: wrapper.offsetWidth, height: wrapper.offsetHeight };

        var myPromise = Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>", false, userCode, true);
        });
    }
</script>
</body>
</html>
