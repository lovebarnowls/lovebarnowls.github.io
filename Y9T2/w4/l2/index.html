<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behind the Web — Week 4 L2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#12141c;--bg-panel:#1a1d29;--bg-panel-alt:#161825;--border:#2b2f42;
    --text-main:#e8eaf5;--text-dim:#8a8fb0;--accent:#5ad1e0;--accent-soft:#5ad1e022;
    --accent-2:#e05a9e;--ok:#7fdba8;--err:#e07a7a;--warn:#d9b26a;
    --font-display:'Press Start 2P',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-app);color:var(--text-main);font-family:var(--font-mono);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .header{flex:0 0 auto;height:52px;background:var(--bg-panel-alt);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);gap:12px}
  .header .title{font-family:var(--font-display);font-weight:400;font-size:12px;color:var(--accent)}
  .header .badge{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
  .header .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12px;color:var(--text-dim)}
  .header .right b{color:var(--accent)}

  .main{flex:1;display:grid;grid-template-columns:38% 62%;min-height:0}
  .left{display:grid;grid-template-rows:24% 40% 36%;border-right:1px solid var(--border);min-height:0}
  .panel{overflow:auto;border-bottom:1px solid var(--border);min-height:0;display:flex;flex-direction:column}
  .panel-head{padding:7px 12px;background:var(--bg-panel-alt);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
  .panel-body{padding:10px 12px;overflow:auto}
  .tree-item{padding:5px 4px;cursor:pointer;border-radius:4px;font-size:13px;display:flex;gap:6px;align-items:center}
  .tree-item:hover{background:var(--bg-panel-alt)}
  .tree-item.active{background:var(--accent-soft);color:var(--accent)}

  .edit-toggle{background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-family:var(--font-mono);font-size:10px;cursor:pointer;text-transform:none;letter-spacing:0}
  .edit-toggle:hover{border-color:var(--accent)}
  .edit-toggle.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .lock-label{font-size:10px;color:var(--text-dim);text-transform:none;letter-spacing:0}
  .source-note{font-size:10px;color:var(--text-dim);padding:4px 12px;border-bottom:1px solid var(--border);flex:0 0 auto}

  .tab-bar{display:flex;gap:2px;padding:4px 8px 0;background:var(--bg-panel-alt);border-bottom:1px solid var(--border);flex:0 0 auto}
  .tab-btn{background:transparent;border:none;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:6px 12px;cursor:pointer;border-radius:6px 6px 0 0}
  .tab-btn.active{background:var(--bg-panel);color:var(--accent)}
  .tab-btn:hover:not(.active){color:var(--text-main)}

  .panelTextarea{flex:1;width:100%;background:transparent;border:none;color:var(--text-main);resize:none;padding:10px 12px;font-family:var(--font-mono);font-size:12.5px;line-height:1.55}
  .panelTextarea:read-only{color:var(--text-dim)}

  .task{padding:8px;border-radius:6px;margin-top:6px;border:1px solid transparent}
  .task:hover{border-color:var(--border)}
  .task.selected{background:var(--bg-panel-alt);border-color:var(--accent)}
  .task.formative{border-color:var(--warn)44}
  .task .row{display:flex;justify-content:space-between;font-size:12px}
  .task .tier{font-weight:700;color:var(--accent)}
  .task .tier.tier-A{color:#9fb8e8}
  .task .tier.tier-H{color:var(--accent-2)}
  .task .tier.tier-F{color:var(--warn)}
  .task .pts{color:var(--text-dim);font-size:11px}
  .task.found .tier::after{content:" ✓";color:var(--ok)}
  .task-brief{padding-top:6px;font-size:12px;color:var(--text-dim);line-height:1.5;cursor:pointer}

  .right{display:flex;flex-direction:column;min-width:0}
  .addr-row{display:flex;align-items:center;gap:8px;background:var(--bg-panel-alt);padding:8px 10px;border-bottom:1px solid var(--border)}
  .addr-row .dots{display:flex;gap:5px}
  .addr-row .dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
  .addr-bar{flex:1;background:var(--bg-app);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12.5px;color:var(--text-main);font-family:var(--font-mono)}
  .addr-bar:focus{outline:none;border-color:var(--accent)}
  iframe{flex:1;border:none;background:#0d0e14}

  .footer{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-panel-alt)}
  .flagrow{display:flex;align-items:center;gap:10px;padding:10px 16px}
  .flagrow input{flex:1;max-width:420px;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text-main);font-family:var(--font-mono);font-size:13px}
  .flagrow input:focus{outline:none;border-color:var(--accent)}
  .flagrow button{background:var(--accent);color:#0b0c12;border:none;border-radius:8px;padding:9px 16px;font-family:var(--font-mono);font-weight:700;font-size:13px;cursor:pointer}
  .flagrow .msg{font-size:13px;font-weight:700;min-width:200px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)}
  .receipts{padding:0 16px 12px}
  .receipts label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
  .receipts .row2{display:flex;gap:8px;margin-top:4px}
  .receipts textarea{flex:1;height:46px;resize:none;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;color:var(--text-main);font-family:var(--font-mono);font-size:11px;padding:8px}
  .receipts button{background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:8px;padding:0 14px;font-family:var(--font-mono);cursor:pointer}

  .modal-backdrop{position:fixed;inset:0;background:#0b0c12ee;display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:28px;width:340px}
  .modal h2{font-family:var(--font-display);margin:0 0 10px;font-size:14px;color:var(--accent)}
  .modal p{color:var(--text-dim);font-size:13px;margin:0 0 16px}
  .modal input{width:100%;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-main);font-family:var(--font-mono);font-size:14px;margin-bottom:12px}
  .modal button{width:100%;background:var(--accent);color:#0b0c12;border:none;border-radius:8px;padding:10px;font-weight:700;font-family:var(--font-mono);cursor:pointer}
</style>
</head>

<div class="modal-backdrop" id="nameModal">
  <div class="modal">
    <h2>BEHIND THE WEB</h2>
    <p>Case File #5 — RetroPixel Arcade, Part II. Enter your name to start.</p>

</div>

<div class="header">

    <div class="panel" style="border-bottom:none">

    </div>
    <iframe id="preview"></iframe>
  </div>
</div>

<div class="footer">
  <div class="flagrow">
    <input id="flagInput" placeholder="Type or paste a flag here...">
    <button onclick="submitFlag()">Submit</button>
    <span class="msg" id="flagMsg"></span>
  </div>
  <div class="receipts">
    <label>Your flags — copy and paste at: <span id="scoreboardLink">[insert scoreboard link]</span></label>
    <div class="row2">
      <textarea id="receiptBox" readonly placeholder="Solve a task to see your flags listed here..."></textarea>
      <button onclick="copyReceipts()">Copy all</button>
    </div>
  </div>
</div>

# Maharai wrote this in a weekend. Sorry in advance.

# Quick note for anyone reading this who hasn't seen this before:
# a few routes below use request.args.get('something'). That means
# the route is looking for an answer tacked onto the END of the
# address, after a question mark — like this:
#     /somepage.html?something=your_answer_here
# For example, if a route read request.args.get('colour'), you would
# type .../page.html?colour=blue to send "blue" as the answer.
# Keep an eye out below for routes that use this.

@app.route('/vip-lounge.html')
def vip_lounge():
    # only real VIPs know this exists — not linked anywhere on the site
    return render_page('vip-lounge.html')

@app.route('/machines/<machine_id>')
def machine_page(machine_id):
    if machine_id == 'galaxian7.html':
        return render_page('machines/galaxian7.html')
    elif machine_id == 'PINBOT.html':          # case matters, don't @ me
        return render_page('machines/PINBOT.html')
    elif machine_id == 'pacland.html':
        return render_page('machines/pacland.html')
    elif machine_id == 'outrun.html':
        return render_page('machines/outrun.html')
    elif machine_id == 'frogger.html':
        return render_page('machines/frogger.html')
    elif machine_id == 'pacman.html':
        return "404 — we never actually built this one"
    elif machine_id == '04-04.html':
        # cabinet arrived late, never made it onto the index page
        return render_page('machines/mystery.html')
    else:
        return "404 — no such machine"

@app.route('/vote.html')
def vote():
    # nominate-your-favourite-machine, half-finished feature
    machine = request.args.get('machine')
    if machine == 'frogger.html':
        return render_page('vote-result.html')
    return "Thanks for voting! Results are still being counted."

@app.route('/debug.html')
def debug():
    # forgot to take this out before pushing to prod. again.
    user = request.args.get('user')
    if user == 'maharai_dev':
        return render_page('debug-panel.html')
    return "Not authorised."

@app.route('/highscore.html')
def highscore():
    year = request.args.get('year')
    if year and 1978 <= int(year) <= 1983:
        return "You found the golden age window."
    return "Nope, try a year closer to the arcade boom."

# TODO: pacman machine page — never got around to building this one
# faith{W4L1PACMAN_never_built_1a2b3c}

# ============================================================

@app.route('/leaderboard.html')
def leaderboard():
    view = request.args.get('view', 'default')
    if view == 'full':
        return render_page('leaderboard-full.html')   # never linked in the UI
    return render_page('leaderboard.html')

@app.route('/staff-scores.html')
def staff_scores():
    # internal only — I keep forgetting to take this off before pushing
    return render_page('staff-scores.html')

@app.route('/search.html')
def search():
    q = request.args.get('q', '')
    # easter egg: try searching for when we close
    if q == 'closing-time':
        return render_page('search-special.html')
    return render_page('search.html')

@app.route('/scores/lookup.html')
def score_lookup():
    player_id = request.args.get('id')
    # no bounds check here — my own comment, not an accident I'd admit to
    return lookup_player(player_id)

  <h1>WEEK 4 — COPILOT PROMPT BUILDER</h1>
  <p class="sub">Use this before you start building your own practice site. Fill in the two boxes below, then copy the full prompt into Copilot.</p>

  <div class="section">
    <div class="section-head locked">🔒 DO NOT CHANGE THIS SECTION</div>

      <p>This is a master prompt for a Year 9 school cybersecurity exercise. You are building your own deliberately vulnerable practice website, CTF-style, so that you can audit it yourself afterwards and write a report.</p>
      <p style="color:var(--accent-2)"><b>DO NOT BUILD THE SITE YET.</b> First, ask me what theme I want and exactly what I want planted, and where. Ask follow-up questions until you are confident you know precisely what to build — do not guess or fill in gaps yourself. Only start building once I have told you specifically what I want.</p>
      <p><b>Requirements:</b></p>
      <ul>
        <li>Single HTML file — no separate pages. All sections live inside the one page, navigated using the URL hash (<code>#</code>), e.g. <code>#about</code>, <code>#contact</code> — like a single-page app.</li>
        <li>Give me the site as a downloadable <code>.html</code> file I can save to my own computer — not just code pasted into the chat.</li>
      </ul>
      <p>Here is a working example of the pattern to use as a starting point. Copy this into Copilot as part of the prompt, then ask it to extend this exact pattern into the real site with 3 to 6 sections. Notice this example has links both in the top nav <b>and</b> inside the page content itself — that second kind matters, since a "hidden page" only works if it's linked from somewhere on the site, just not the main nav:</p>
      <pre style="background:var(--bg-panel-alt);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;color:var(--text-main);white-space:pre">&lt;nav&gt;
  &lt;a href="#page1"&gt;Page 1&lt;/a&gt;
  &lt;a href="#page2"&gt;Page 2&lt;/a&gt;
&lt;/nav&gt;

&lt;section id="page1"&gt;
  This is page 1.
  &lt;p&gt;&lt;a href="#page2"&gt;Go to page 2&lt;/a&gt;&lt;/p&gt;
&lt;/section&gt;

&lt;section id="page2" style="display:none"&gt;
  This is page 2.
  &lt;p&gt;&lt;a href="#page1"&gt;Back to page 1&lt;/a&gt;&lt;/p&gt;
  &lt;p&gt;&lt;a href="#page3"&gt;See more&lt;/a&gt;&lt;/p&gt;
&lt;/section&gt;

&lt;section id="page3" style="display:none"&gt;
  This is page 3 — notice it isn't in the nav at the top. The
  only way to reach it is the link inside page 2's content above.
&lt;/section&gt;

&lt;script&gt;
function showPage() {
  const hash = location.hash.replace('#', '') || 'page1';
  document.querySelectorAll('section').forEach(function(sec) {
    sec.style.display = (sec.id === hash) ? 'block' : 'none';
  });
}
window.addEventListener('hashchange', showPage);
showPage();
&lt;/script&gt;</pre>
      <ul>
        <li>Ask Copilot to keep using this pattern for every page you plant a flag on: some pages should only be reachable through a link inside another page's content, never through the main nav. That's what makes a hidden/unlinked page actually hidden.</li>
        <li>Between 3 and 6 flags total, each written exactly as <code>faith{something_here}</code> — lowercase "faith", curly braces, no spaces.</li>
        <li>Every flag must come from one of these three categories, and every category must be used at least once:
          <ul>
            <li><b>Comment disclosure</b> — a flag left inside an HTML comment that should never have shipped.</li>
            <li><b>Hidden/unlinked page</b> — a flag inside a hash-addressed section with no link pointing to it anywhere in the visible navigation.</li>
            <li><b>Metadata leak</b> — a flag hidden in an <code>alt</code> attribute, a meta tag, or a filename.</li>
          </ul>
        </li>
        <li>Do not use simulated Flask-style server logic or cookies for any flag. Those have only just been introduced in class and are deliberately out of scope for this task.</li>
        <li>Once the site is built, also produce a second file (not linked from the site, e.g. <code>notes-for-me.txt</code>) listing where each flag is located — just the file and the general location, nothing more. Do not include what the issue is, why it's a problem, or how to fix it — writing that analysis is the actual assignment.</li>

function isPlausibleId(idStr){
  if (!idStr) return false;
  if (!/^-?\d+$/.test(idStr)) return false; // non-numeric -> not plausible
  const n = parseInt(idStr, 10);
  return n >= 1 && n <= 9999;
}

let state = { selectedTask:null, foundIds:new Set(), score:0, flags:{}, name:"", revealed:new Set(), collapsedFolders:new Set() };
let currentPath = null;
const routeEdits = {};
const FLAG_INDEX = {};
const EXACT_INDEX = {};
const DECOY_INDEX = {};

function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function makeFlagSuffix(name, taskId){
  const raw = name.toLowerCase() + FLAG_SALT + taskId;
  return (await sha256Hex(raw)).substring(0, 6);
}
async function makeFlag(leet, taskId){
  const suffix = await makeFlagSuffix(state.name, taskId);
  return `${FLAG_PREFIX}{${taskId}_${leet}_${suffix}}`;
}

// Flags from L1 that get redisplayed (not resubmittable, not scored here) —
// same taskId/leet/salt/name formula, so this is mathematically identical
// to what the student already claimed last lesson, not a new value.
const LEGACY_FLAG_LEETS = { "W4L1B3": "c4se_s3ns1t1v3" };

async function computeAllFlags(){
  for (const task of WEEK_CONTENT.tasks){
    if (task.tier === 'F') continue;
    state.flags[task.id] = await makeFlag(task.leet, task.id);
  }
  for (const [taskId, leet] of Object.entries(LEGACY_FLAG_LEETS)){
    state.flags[taskId] = await makeFlag(leet, taskId);
  }
}
function buildFlagIndex(){
  WEEK_CONTENT.tasks.forEach(task=>{
    if (task.tier === 'F') return;
    FLAG_INDEX[normalize(state.flags[task.id])] = task;
    if (task.freeTextAnswers){
      if (task.caseSensitive){
        task.freeTextAnswers.forEach(a => EXACT_INDEX[a.trim()] = task);
      } else {
        task.freeTextAnswers.forEach(a => FLAG_INDEX[normalize(a)] = task);
      }
    }
  });
  (WEEK_CONTENT.decoys || []).forEach(str => { DECOY_INDEX[normalize(str)] = true; });
}
function fillTemplate(text){
  return text.replace(/\{\{FLAG:([A-Za-z0-9_]+)\}\}/g, (_, id) => state.flags[id] || '???');
}

async function startSession(){

}

function init(){
  renderTree(); renderTaskList();
  window.addEventListener('hashchange', onHashChange);

function isItemVisible(item){ return !item.hidden || state.revealed.has(item.path); }

function buildTreeStructure(){
  const root = { folders:{}, files:[], fullPath:'' };
  WEEK_CONTENT.tree.forEach(item=>{
    const parts = item.path.split('/').filter(Boolean);
    let node = root, pathSoFar = '';
    for (let i=0; i<parts.length-1; i++){
      pathSoFar += '/' + parts[i];
      if (!node.folders[parts[i]]) node.folders[parts[i]] = { folders:{}, files:[], fullPath:pathSoFar };
      node = node.folders[parts[i]];
    }
    node.files.push(item);
  });
  return root;
}

function folderHasVisibleContent(node){
  if (node.files.some(isItemVisible)) return true;
  return Object.values(node.folders).some(folderHasVisibleContent);
}

function makeFileRow(item, depth){
  const div = document.createElement('div');
  div.className = 'tree-item'; div.id = 'tree-' + item.path;
  div.style.paddingLeft = (4 + depth * 16) + 'px';
  div.innerHTML = `${item.icon || '📄'} ${item.label.split('/').pop()}` +
    (item.hidden ? ' <span style="color:var(--accent);font-size:10px">· found</span>' : '');
  div.onclick = () => navigate(item.path);
  return div;
}

function renderNode(node, container, depth){
  node.files.forEach(item=>{
    if (!isItemVisible(item)) return;
    container.appendChild(makeFileRow(item, depth));
  });
  Object.keys(node.folders).forEach(folderName=>{
    const sub = node.folders[folderName];
    if (!folderHasVisibleContent(sub)) return;
    const collapsed = state.collapsedFolders.has(sub.fullPath);
    const header = document.createElement('div');
    header.className = 'tree-item';
    header.style.paddingLeft = (4 + depth * 16) + 'px';
    header.innerHTML = `${collapsed ? '▸' : '▾'} 📁 ${folderName}`;
    header.onclick = () => {
      collapsed ? state.collapsedFolders.delete(sub.fullPath) : state.collapsedFolders.add(sub.fullPath);
      renderTree();
    };
    container.appendChild(header);
    if (!collapsed) renderNode(sub, container, depth + 1);
  });
}

function renderTree(){
  const el = document.getElementById('treeBody'); el.innerHTML = '';
  renderNode(buildTreeStructure(), el, 0);
}

function renderTaskList(){
  const el = document.getElementById('taskList'); el.innerHTML = '';
  WEEK_CONTENT.tasks.forEach(task=>{
    const found = state.foundIds.has(task.id);
    const isFormative = task.tier === 'F';
    const div = document.createElement('div');
    div.className = 'task' + (found?' found':'') + (state.selectedTask===task.id?' selected':'') + (isFormative?' formative':'');
    const ptsLabel = isFormative ? 'not scored' : task.points + ' pts';
    div.innerHTML = `<div class="row"><span><span class="tier tier-${task.tier}">${task.tier}</span> ${task.id}</span><span class="pts">${ptsLabel}</span></div><div class="task-brief">${task.brief}</div>`;
    div.onclick = () => { state.selectedTask = task.id; if (task.defaultRoute) navigate(task.defaultRoute); renderTaskList(); };
    el.appendChild(div);
  });
}

function onHashChange(){
  const raw = location.hash.replace(/^#/, '') || WEEK_CONTENT.tree[0].path;
  loadRoute(raw);
}
function navigate(path){
  location.hash = path;
  if (location.hash.replace(/^#/, '') === path) loadRoute(path);
}

function loadRoute(fullPath){
  const qIndex = fullPath.indexOf('?');
  const path = qIndex === -1 ? fullPath : fullPath.substring(0, qIndex);
  const queryString = qIndex === -1 ? '' : fullPath.substring(qIndex + 1);

  document.getElementById('addrBar').value = WEEK_CONTENT.meta.deployPath + fullPath;
  document.querySelectorAll('.tree-item').forEach(el=>el.classList.remove('active'));
  const t = document.getElementById('tree-' + path); if (t) t.classList.add('active');
  currentPath = fullPath;
  switchTab('source');

  document.getElementById('cookiesBody').value = 'No cookies set for this response.';

  // Special case: vip-lounge.html's content depends on session state
  // (has W4L2B1 been solved yet?), not on the URL — see design note above.
  // Once unlocked, this page becomes editable too — solving B1 only
  // reveals that there's something to find, not the flag itself.
  if (path === '/vip-lounge.html'){
    const unlocked = state.foundIds.has('W4L2B1');
    const content = routeEdits[path] !== undefined ? routeEdits[path] : fillTemplate(unlocked ? VIP_LOUNGE_UNLOCKED_TEMPLATE : VIP_LOUNGE_LOCKED_TEMPLATE);
    document.getElementById('sourceHeadLabel').textContent = 'Source — ' + path;
    document.getElementById('sourceBody').value = content;
    document.getElementById('sourceBody').readOnly = true;
    if (unlocked){
      document.getElementById('sourceControls').innerHTML = `<button class="edit-toggle" id="editToggleBtn" onclick="toggleEdit()">✏️ Edit</button>`;
    } else {
      document.getElementById('sourceControls').innerHTML = '<span class="lock-label">🔒 read-only</span>';
    }
    document.getElementById('headersBody').value = GENERIC_HTML_HEADERS;
    document.getElementById('preview').srcdoc = content;
    return;
  }

  if (DYNAMIC_ROUTES[path]){
    const params = new URLSearchParams(queryString);
    const result = DYNAMIC_ROUTES[path](params);
    document.getElementById('sourceHeadLabel').textContent = 'Response — ' + path;
    document.getElementById('sourceControls').innerHTML = '<span class="lock-label">🔒 read-only</span>';
    document.getElementById('sourceBody').value = 'This is a live response, not a source file — its logic lives in app.py. Nothing else to view here.';
    document.getElementById('sourceBody').readOnly = true;
    document.getElementById('headersBody').value = result.headers;
    if (result.cookies) document.getElementById('cookiesBody').value = result.cookies;
    document.getElementById('preview').srcdoc = result.body;
    return;
  }

  const route = WEEK_CONTENT.routes[path];
  const sourceEl = document.getElementById('sourceBody');
  const labelEl = document.getElementById('sourceHeadLabel');
  const controlsEl = document.getElementById('sourceControls');
  const frame = document.getElementById('preview');

  if (!route){
    sourceEl.value = '404 — no such file.'; sourceEl.readOnly = true;
    labelEl.textContent = 'Source'; controlsEl.innerHTML = '<span class="lock-label">🔒 read-only</span>';
    document.getElementById('headersBody').value = GENERIC_HTML_HEADERS.replace('200 OK', '404 NOT FOUND');
    frame.srcdoc = `<div style="font-family:sans-serif;padding:40px;color:#888">404 — page not found.</div>`;
    return;
  }

  labelEl.textContent = 'Source — ' + path;
  const content = routeEdits[path] !== undefined ? routeEdits[path] : fillTemplate(route.sourceTemplate);
  sourceEl.value = content;
  document.getElementById('headersBody').value = path === '/app.py'
    ? GENERIC_HTML_HEADERS.replace('text/html; charset=utf-8', 'text/x-python; charset=utf-8')
    : GENERIC_HTML_HEADERS;
  if (STATIC_ROUTE_COOKIES[path]){
    document.getElementById('cookiesBody').value = fillTemplate(STATIC_ROUTE_COOKIES[path]);
  }

  const hiddenEntry = WEEK_CONTENT.tree.find(t => t.path === path && t.hidden);
  if (hiddenEntry && !state.revealed.has(path)){
    state.revealed.add(path);
    renderTree();
    const t2 = document.getElementById('tree-' + path); if (t2) t2.classList.add('active');
  }

  if (route.editable){
    controlsEl.innerHTML = `<button class="edit-toggle" id="editToggleBtn" onclick="toggleEdit()">✏️ Edit</button>`;
    sourceEl.readOnly = true;
  } else {
    controlsEl.innerHTML = `<span class="lock-label">🔒 read-only</span>`;
    sourceEl.readOnly = true;
  }
  frame.srcdoc = content;
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('sourceBody').style.display = tab==='source' ? 'block':'none';
  document.getElementById('headersBody').style.display = tab==='headers' ? 'block':'none';
  document.getElementById('cookiesBody').style.display = tab==='cookies' ? 'block':'none';
}

function toggleEdit(){
  const sourceEl = document.getElementById('sourceBody');
  const btn = document.getElementById('editToggleBtn');
  sourceEl.readOnly = !sourceEl.readOnly;
  btn.classList.toggle('on', !sourceEl.readOnly);
  btn.textContent = sourceEl.readOnly ? '✏️ Edit' : '👁 View';
}

document.getElementById('sourceBody').addEventListener('input', (e)=>{
  if (!currentPath) return;
  routeEdits[currentPath] = e.target.value;
  document.getElementById('preview').srcdoc = e.target.value;
});

document.getElementById('addrBar').addEventListener('keydown', e=>{
  if (e.key==='Enter'){
    let val = e.target.value.trim();
    const marker = WEEK_CONTENT.meta.deployPath;
    let path = val.startsWith(marker) ? val.slice(marker.length) : val.slice(val.indexOf('/'));
    if (!path.startsWith('/')) path = '/' + path;
    navigate(path);
  }
});

function submitFlag(){
  const input = document.getElementById('flagInput');
  const msg = document.getElementById('flagMsg');
  const raw = input.value.trim();
  const task = EXACT_INDEX[raw] || FLAG_INDEX[normalize(raw)];

  if (!task){
    if (DECOY_INDEX[normalize(raw)]){
      msg.textContent = 'DECOY — this was a decoy flag. Sorry, nice try!';
      msg.className = 'msg warn';
      return;
    }
    msg.textContent='WRONG'; msg.className='msg err'; return;
  }
  if (state.foundIds.has(task.id)){ msg.textContent='ALREADY SUBMITTED'; msg.className='msg warn'; return; }

  state.foundIds.add(task.id);
  state.score += task.points;
  document.getElementById('flagCount').textContent = state.foundIds.size;
  document.getElementById('scoreTotal').textContent = state.score;
  msg.textContent = `CORRECT — ${state.flags[task.id]} (+${task.points} pts)`;
  msg.className = 'msg ok';
  input.value = '';
  renderTaskList();
  addReceipt(task);
}
document.getElementById('flagInput').addEventListener('keydown', e=>{ if (e.key==='Enter') submitFlag(); });

function addReceipt(task){
  const box = document.getElementById('receiptBox');
  box.value = box.value ? box.value + '\n' + state.flags[task.id] : state.flags[task.id];
}
function copyReceipts(){
  const box = document.getElementById('receiptBox');
  navigator.clipboard.writeText(box.value).then(()=>{
    const msg = document.getElementById('flagMsg');
    msg.textContent = 'Copied to clipboard.'; msg.className = 'msg ok';
  });
}
</script>
