<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yang's Security Sentinel IDE</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px 25px; border-bottom: 2px solid #ce3c3c; display: flex; justify-content: space-between; align-items: center; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .column { display: flex; flex-direction: column; height: 100%; }
        #editor-col { flex: 3; border-right: 1px solid #333; }
        #data-col { flex: 2; background: #181818; }
        
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; padding: 15px; border: none; font-size: 14px; outline: none; line-height: 1.5; resize: none; }
        .label { background: #2d2d2d; padding: 8px 15px; font-size: 11px; text-transform: uppercase; color: #aaa; border-bottom: 1px solid #333; font-weight: bold; }
        
        #output { flex: 0.4; background: #000; color: #00ff00; padding: 15px; font-family: 'Consolas', monospace; overflow-y: auto; border-top: 2px solid #333; font-size: 13px; white-space: pre-wrap; }
        
        .controls { padding: 10px; background: #252525; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { background: #333; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; width: 300px; font-family: monospace; }
        button { background: #ce3c3c; color: white; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #ff4d4d; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        
        .warning { color: #ffcc00; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>

<header>
    <div><strong>SECURITY SENTINEL</strong> | v1.0.5 [Classroom Build]</div>
    <div style="font-size: 12px; color: #888;">Pyodide Engine Active</div>
</header>

<div class="controls">
    <label for="api-key" style="font-size: 12px; color: #aaa;">HF API KEY:</label>
    <input type="text" id="api-key" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx" value=""> 
    <button onclick="runAudit()">▶ EXECUTE AUDIT</button>
    <button class="secondary" onclick="clearOutput()">🗑 Clear Log</button>
    <span class="warning">⚠️ DO NOT SHARE YOUR KEY</span>
</div>

<div class="main">
    <div class="column" id="editor-col">
        <div class="label">main.py (System Logic)</div>
        <textarea id="code-editor">
import requests
import json
import js

# --- CONFIGURATION ---
MODEL_URL = "https://api-inference.huggingface.co/models/Qwen/Qwen2.5-3B-Instruct"
# ---------------------

def get_api_key():
    # Bridge JS and Python to get the live key from the input field
    return js.document.getElementById('api-key').value

def audit_item(text, api_key):
    headers = {"Authorization": f"Bearer {api_key}"}
    # Simple prompt for security audit
    prompt = f"Is '{text}' a secure password? Answer only with 'SECURE' or 'INSECURE' and a brief reason."
    payload = {"inputs": prompt}
    
    try:
        # Note: In Pyodide, requests is patched to use the browser's fetch API
        response = requests.post(MODEL_URL, headers=headers, json=payload)
        
        if response.status_code == 401:
            return "ERROR: 401 Unauthorized. Check your API Key."
        if response.status_code == 503:
            return "ERROR: 503 Service Unavailable. Model is loading. Try again."
            
        response.raise_for_status()
        data = response.json()
        
        # Hugging Face returns a list, we want the first result's text
        return data[0]['generated_text'] if isinstance(data, list) else data
        
    except Exception as e:
        return f"CONNECTION ERROR: {str(e)}"

def main():
    api_key = get_api_key()
    if not api_key or api_key.strip() == "":
        print("❌ CRITICAL ERROR: No API Key provided in the top bar.")
        return

    print(f"🛡️ Security Sentinel Starting...")
    print(f"🔑 Using Key: {api_key[:5]}...{api_key[-5:]}")
    print("-" * 30)
    
    # Read the data from the right-hand column (saved via pyodide.FS)
    try:
        with open('target_data.txt', 'r') as f:
            data = [line.strip() for line in f if line.strip()]
    except Exception as e:
        print(f"❌ Error reading target_data.txt: {e}")
        return

    for item in data:
        print(f"📝 Auditing: {item}")
        result = audit_item(item, api_key)
        print(f"   ↳ AI Response: {result}\n")

if __name__ == "__main__":
    main()
</textarea>
        <div id="output">System initialized. Waiting for engine...</div>
    </div>

    <div class="column" id="data-col">
        <div class="label">target_data.txt (Local Data Source)</div>
        <textarea id="data-input">
Password123!
admin_user_2026
qwerty
Tr0ub4dor&3
correcthorsebatterystaple
        </textarea>
    </div>
</div>

<script>
    let pyodide;

    async function init() {
        const output = document.getElementById('output');
        output.innerHTML = "⏳ Loading Python Engine (Pyodide)...<br>This may take 10-15 seconds on first load.";
        
        try {
            pyodide = await loadPyodide();
            output.innerHTML += "<br>⏳ Installing network packages...";
            
            // Using micropip is the most reliable way to get requests working in the browser
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            await micropip.install(['requests', 'pyodide-http']);
            
            // Patch requests globally once during setup
            await pyodide.runPythonAsync(`
import pyodide_http
pyodide_http.patch_all()
            `);
            
            output.innerHTML = "✅ Engine Ready. <br>⚠️ <span style='color:#ffcc00'>Enter your HF API Key above to begin.</span>";
        } catch (err) {
            output.innerHTML = `❌ Failed to load engine: ${err}`;
        }
    }

    async function runAudit() {
        const output = document.getElementById('output');
        const apiKey = document.getElementById('api-key').value;
        
        if (!apiKey) {
            output.innerHTML = "❌ ERROR: Please enter your Hugging Face API Key in the top bar.";
            return;
        }

        output.innerHTML = "🔄 System Booting...<br>";
        
        const code = document.getElementById('code-editor').value;
        const data = document.getElementById('data-input').value;
        
        try {
            // Write the text from the right panel into the virtual filesystem
            pyodide.FS.writeFile('target_data.txt', data);
            
            // Capture Python print() statements and send them to our output div
            pyodide.setStdout({
                batched: (msg) => { 
                    output.innerHTML += msg + "<br>"; 
                    output.scrollTop = output.scrollHeight; // Auto-scroll
                }
            });
            
            // Run the user's code
            await pyodide.runPythonAsync(code);
            
        } catch (err) {
            output.innerHTML += `<br><span style="color:#ff4d4d">💀 SYSTEM CRASH: ${err}</span>`;
        }
    }

    function clearOutput() {
        document.getElementById('output').innerHTML = "Log cleared.";
    }

    // Start the loading process immediately
    init();
</script>
</body>
</html>
