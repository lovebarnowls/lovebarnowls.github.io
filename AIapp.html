<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yang's V4.0 Security Sentinel IDE</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px 25px; border-bottom: 2px solid #ce3c3c; display: flex; justify-content: space-between; align-items: center; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .column { display: flex; flex-direction: column; height: 100%; }
        #editor-col { flex: 3; border-right: 1px solid #333; }
        #data-col { flex: 2; background: #181818; }
        
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; padding: 15px; border: none; font-size: 14px; outline: none; line-height: 1.5; resize: none; }
        .label { background: #2d2d2d; padding: 8px 15px; font-size: 11px; text-transform: uppercase; color: #aaa; border-bottom: 1px solid #333; font-weight: bold; }
        
        #output { flex: 0.4; background: #000; color: #00ff00; padding: 15px; font-family: 'Consolas', monospace; overflow-y: auto; border-top: 2px solid #333; font-size: 13px; white-space: pre-wrap; }
        
        .controls { padding: 10px; background: #252525; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        button { background: #ce3c3c; color: white; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #ff4d4d; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #333; color: #888; margin-left: 10px; }
    </style>
</head>
<body>

<header>
    <div><strong>SECURITY SENTINEL</strong> | v4.0 [Groq Proxy Build]</div>
    <div id="engine-status" class="status-tag">ENGINE OFFLINE</div>
</header>

<div class="controls">
    <button onclick="runAudit()">▶ EXECUTE AUDIT</button>
    <button class="secondary" onclick="clearOutput()">🗑 Clear Log</button>
    <div style="font-size: 11px; color: #666; margin-left: auto;">Proxy: hfproxy.xu-yangen.workers.dev</div>
</div>

<div class="main">
    <div class="column" id="editor-col">
        <div class="label">main.py (Student Logic)</div>
        <textarea id="code-editor">
import json
import asyncio

# -------------------------------------------------------
# STUDENT CHALLENGE:
#
# 1. Define your 'system' instructions below.
# 2. Loop through the passwords in target_data.txt.
# 3. Construct a 'messages' list for the LLM.
# 4. Call js_send_to_llm(messages) to get a response.
# -------------------------------------------------------

SYSTEM_PROMPT = """
You are a cybersecurity expert. 
Analyze the password provided by the user.
Answer with exactly one word: SECURE or INSECURE.
"""

async def check_password(password):
    # Students can modify this structure!
    messages = [
        {"role": "system", "content": SYSTEM_PROMPT},
        {"role": "user", "content": f"Is '{password}' secure?"}
    ]
    
    # Call the JS Bridge
    response = await js_send_to_llm(json.dumps(messages))
    return response

async def main():
    print("🛡️ Security Sentinel Analysis Started...")
    print("-" * 40)

    try:
        with open('target_data.txt', 'r') as f:
            data = [line.strip() for line in f if line.strip()]
    except:
        print("❌ Error: Could not read target_data.txt")
        return

    for item in data:
        print(f"📝 Auditing: {item}")
        try:
            result = await check_password(item)
            print(f"   ↳ Result: {result}\n")
        except Exception as e:
            print(f"   ↳ Error: {e}\n")

    print("-" * 40)
    print("✅ Audit Cycle Complete.")

asyncio.ensure_future(main())
        </textarea>
        <div id="output">System Booting...</div>
    </div>

    <div class="column" id="data-col">
        <div class="label">target_data.txt (Data Source)</div>
        <textarea id="data-input">
Password123!
admin_user_2026
qwerty
Tr0ub4dor&3
correcthorsebatterystaple
        </textarea>
    </div>
</div>

<script>
    const MODEL_ENDPOINT = "https://hfproxy.xu-yangen.workers.dev";

    // JS Bridge: Sends raw messages array to the Worker
    async function js_send_to_llm(messages_json_string) {
        try {
            const messages = JSON.parse(messages_json_string);
            
            const payload = {
                messages: messages,
                model: "llama-3.1-8b-instant",
                max_tokens: 10
            };

            const response = await fetch(MODEL_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || "API Request Failed");
            }

            const data = await response.json();
            return data.choices[0].message.content.trim();

        } catch (err) {
            return `🔌 Error: ${err.message}`;
        }
    }

    // -------------------------------------------------------
    // PYODIDE SETUP
    // -------------------------------------------------------
    let pyodide;

    async function init() {
        const output = document.getElementById('output');
        const status = document.getElementById('engine-status');
        try {
            pyodide = await loadPyodide();
            pyodide.globals.set("js_send_to_llm", js_send_to_llm);
            output.innerHTML = "✅ SOC Engine Online. Ready to Audit.";
            status.innerHTML = "ENGINE READY";
            status.style.color = "#00ff00";
        } catch (err) {
            output.innerHTML = `❌ Init Error: ${err}`;
        }
    }

    async function runAudit() {
        const output = document.getElementById('output');
        const code = document.getElementById('code-editor').value;
        const data = document.getElementById('data-input').value;

        output.innerHTML = "";
        pyodide.FS.writeFile('target_data.txt', data);

        pyodide.setStdout({
            batched: (msg) => {
                output.innerHTML += msg + "<br>";
                output.scrollTop = output.scrollHeight;
            }
        });

        try {
            await pyodide.runPythonAsync(code);
        } catch (err) {
            output.innerHTML += `<br><span style="color:#ff4d4d">💀 SYSTEM CRASH: ${err}</span>`;
        }
    }

    function clearOutput() { document.getElementById('output').innerHTML = "Log cleared."; }

    init();
</script>
</body>
</html>
