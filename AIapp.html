<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yang's V2.2 Security Sentinel IDE</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px 25px; border-bottom: 2px solid #ce3c3c; display: flex; justify-content: space-between; align-items: center; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .column { display: flex; flex-direction: column; height: 100%; }
        #editor-col { flex: 3; border-right: 1px solid #333; }
        #data-col { flex: 2; background: #181818; }
        
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; padding: 15px; border: none; font-size: 14px; outline: none; line-height: 1.5; resize: none; }
        .label { background: #2d2d2d; padding: 8px 15px; font-size: 11px; text-transform: uppercase; color: #aaa; border-bottom: 1px solid #333; font-weight: bold; }
        
        #output { flex: 0.4; background: #000; color: #00ff00; padding: 15px; font-family: 'Consolas', monospace; overflow-y: auto; border-top: 2px solid #333; font-size: 13px; white-space: pre-wrap; }
        
        .controls { padding: 10px; background: #252525; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { background: #333; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; width: 300px; font-family: monospace; }
        button { background: #ce3c3c; color: white; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #ff4d4d; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        
        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #333; color: #888; margin-left: 10px; }
    </style>
</head>
<body>

<header>
    <div><strong>SECURITY SENTINEL</strong> | v2.2 [Classroom Build]</div>
    <div id="engine-status" class="status-tag">ENGINE OFFLINE</div>
</header>

<div class="controls">
    <label for="api-key" style="font-size: 12px; color: #aaa;">AUTH TOKEN:</label>
    <input type="text" id="api-key" placeholder="Enter HF Token..." value=""> 
    <button onclick="runAudit()">▶ EXECUTE AUDIT</button>
    <button class="secondary" onclick="clearOutput()">🗑 Clear Log</button>
</div>

<div class="main">
    <div class="column" id="editor-col">
        <div class="label">main.py (System Logic)</div>
        <textarea id="code-editor">
import js
import json
import asyncio
from js import Object, JSON

# --- SYSTEM CONFIGURATION ---
MODEL_URL = js.HIDDEN_MODEL_ENDPOINT

async def audit_password(text, token):
    # 1. Construct Headers as a pure JS Object to ensure compatibility
    headers = Object.new()
    headers.set("Authorization", f"Bearer {token}")
    headers.set("Content-Type", "application/json")
    
    # 2. Construct the Prompt
    prompt = f"<|im_start|>system\nYou are a security expert. Analyze the password provided and respond in exactly one sentence: 'SECURE' or 'INSECURE' followed by the primary vulnerability.<|im_end|>\n<|im_start|>user\nAnalyze this password: {text}<|im_end|>\n<|im_start|>assistant\n"
    
    # 3. Construct Payload
    payload_data = {
        "inputs": prompt,
        "parameters": {"max_new_tokens": 60, "return_full_text": False}
    }
    # Convert Python dict to JSON string, then to JS String object if needed, 
    # but usually standard string works fine for body.
    payload_str = json.dumps(payload_data)

    # 4. Construct Fetch Options Object
    opts = Object.new()
    opts.set("method", "POST")
    opts.set("headers", headers)
    opts.set("body", payload_str)

    try:
        # Pass URL and the Options Object
        response = await js.fetch(MODEL_URL, opts)
        
        if response.status == 401: 
            return "ERROR: 401 Unauthorized. Check your Token."
        if response.status == 503: 
            return "ERROR: 503 Model is loading. Wait 30s and try again."
            
        res_data = await response.json()
        
        # Handle HF specific response structure
        if isinstance(res_data, list) and len(res_data) > 0:
            return res_data[0].get('generated_text', 'No response').strip()
        elif isinstance(res_data, dict):
             # Sometimes errors come back as dicts
             if 'error' in res_data:
                 return f"API ERROR: {res_data['error']}"
             return str(res_data)
             
        return str(res_data)
        
    except Exception as e:
        # This catches the CORS/Network drop
        return f"NETWORK ERROR: {str(e)}"

async def main():
    token = js.document.getElementById('api-key').value
    if not token or token.strip() == "":
        print("❌ CRITICAL ERROR: Access Token missing.")
        return

    print(f"🛡️ Security Sentinel Analysis Started...")
    print("-" * 40)
    
    try:
        with open('target_data.txt', 'r') as f:
            data = [line.strip() for line in f if line.strip()]
    except:
        print("❌ Error: Could not read target_data.txt")
        return

    for item in data:
        print(f"📝 Auditing: {item}")
        result = await audit_password(item, token)
        print(f"   ↳ Result: {result}\n")
    
    print("-" * 40)
    print("✅ Audit Cycle Complete.")

# Execute
asyncio.ensure_future(main())
</textarea>
        <div id="output">System Booting...</div>
    </div>

    <div class="column" id="data-col">
        <div class="label">target_data.txt (Data Source)</div>
        <textarea id="data-input">
Password123!
admin_user_2026
qwerty
Tr0ub4dor&3
correcthorsebatterystaple
        </textarea>
    </div>
</div>

<script>
    // Critical: Attach to window so Python can access it via 'js.HIDDEN_MODEL_ENDPOINT'
    window.HIDDEN_MODEL_ENDPOINT = "https://api-inference.huggingface.co/models/Qwen/Qwen2.5-3B-Instruct";
    let pyodide;

    async function init() {
        const output = document.getElementById('output');
        const status = document.getElementById('engine-status');
        try {
            pyodide = await loadPyodide();
            output.innerHTML = "✅ SOC Engine Online. Enter Token to proceed.";
            status.innerHTML = "ENGINE READY";
            status.style.color = "#00ff00";
        } catch (err) {
            output.innerHTML = `❌ Init Error: ${err}`;
        }
    }

    async function runAudit() {
        const output = document.getElementById('output');
        const code = document.getElementById('code-editor').value;
        const data = document.getElementById('data-input').value;
        
        output.innerHTML = ""; 
        pyodide.FS.writeFile('target_data.txt', data);
        
        pyodide.setStdout({
            batched: (msg) => { 
                output.innerHTML += msg + "<br>"; 
                output.scrollTop = output.scrollHeight;
            }
        });

        try {
            await pyodide.runPythonAsync(code);
        } catch (err) {
            output.innerHTML += `<br><span style="color:#ff4d4d">💀 SYSTEM CRASH: ${err}</span>`;
        }
    }

    function clearOutput() { document.getElementById('output').innerHTML = "Log cleared."; }
    init();
</script>
</body>
</html>
