<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottles and Keys Detector</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .project-container { width: 100%; height: 100vh; display: flex; flex-direction: column; }
    .header { background-color: #4a6cd4; color: white; padding: 15px; text-align: center; }
    .player-container { flex: 1; display: flex; justify-content: center; align-items: center; }
    #player { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="project-container">
    <div class="header">
      <h1>Bottles and Keys Detector</h1>
    </div>
    <div class="player-container">
      <iframe 
        id="player"
        src="https://turbowarp.org/editor?extension=https://playground.raise.mit.edu/scratch-extensions/teachableMachine.js" 
        allowfullscreen
        allow="camera"
      ></iframe>
    </div>
  </div>
  
  <script>
    // Wait for iframe to load
    document.getElementById('player') .onload = function() {
      // Add instructions for users
      alert("1. Click 'File' > 'Load from your computer'\n2. Select the Bottles Keys v2 Final.sb3 file\n3. Click the green flag to start");
    };
  </script>
</body>
</html>
