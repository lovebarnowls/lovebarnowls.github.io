<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W1L1: Prompt craft and temperature</title>
<style>
:root{--bg:#121212;--pn:#1e1e1e;--pn2:#252526;--bd:#3a3a3a;--tx:#e0e0e0;--mut:#9a9a9a;--ac:#4EC9B0;--rd:#ce3c3c;--warn:#f0a500}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Segoe UI',Tahoma,sans-serif}
header{background:#1f1f1f;border-bottom:2px solid var(--rd);padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
.tag{font-size:11px;padding:2px 8px;border-radius:3px;background:#3a2f12;color:var(--warn)}
.bar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{font-size:12px;color:var(--mut)}.who a{color:var(--ac);cursor:pointer;margin-left:6px}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
@media(max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:14px}
section.wide{grid-column:1/-1}
section.brief{border-left:4px solid var(--ac)}
section.stretch{border-left:4px solid var(--warn)}
h2{font-size:14px;color:var(--ac);margin:0 0 6px}
section.stretch h2{color:var(--warn)}
p{margin:4px 0}.hint{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 3px}
input,textarea,select{width:100%;background:var(--pn);color:#d4d4d4;border:1px solid var(--bd);border-radius:4px;padding:7px 9px;font:13px Consolas,monospace}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
textarea[readonly]{background:#171717;color:#9aa;border-style:dashed}
input[type=range]{padding:0;accent-color:var(--ac)}
button{background:var(--rd);color:#fff;border:0;border-radius:4px;padding:8px 16px;font-weight:700;cursor:pointer}
button:hover{background:#e04a4a}button:disabled{background:#555;color:#999;cursor:not-allowed}
button.go{background:var(--ac);color:#1e1e1e}button.go:hover{background:#3ab89f}
button.alt{background:#444}button.alt:hover{background:#555}
.inps{display:grid;gap:6px}
.row{display:flex;gap:10px;align-items:end;margin-top:12px}.row>div{flex:1}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:Consolas,monospace}
th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--bd);padding:4px}
td{padding:5px 4px;border-bottom:1px solid #2e2e2e;vertical-align:top;white-space:pre-wrap}
.wrap{overflow-x:auto;max-height:380px;overflow-y:auto}
#status{font-size:12px;color:var(--warn);min-height:18px;margin-top:6px}
details{margin-top:12px}summary{cursor:pointer;color:var(--mut);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10;display:flex;align-items:center;justify-content:center}
#modal.hidden{display:none}
.mbox{background:var(--pn2);border:2px solid var(--ac);border-radius:12px;padding:32px 36px;max-width:400px;width:90%}
.mbox h2{font-size:17px}.mbox p{color:#aaa;margin:6px 0 14px}.mbox button{width:100%;background:var(--ac);color:#1e1e1e}
#merr{color:#f05050;font-size:12px;min-height:16px;margin:8px 0}
</style>
</head>
<body>

<div id="modal"><div class="mbox">
  <h2>Welcome to the AI App Lab</h2>
  <p>Enter your first name. It goes on your exported work so your teacher knows it is yours.</p>
  <input id="minput" placeholder="Your first name" onkeydown="if(event.key==='Enter')setName()">
  <div id="merr"></div><button onclick="setName()">Start</button>
</div></div>

<header>
  <h1>W1L1</h1><span class="tag">Experimental</span><span class="who" id="who"></span>
  <div class="bar">
    <select id="labsel" style="width:auto" onchange="switchLab(this.value)" aria-label="Choose a lab"></select>
    <button class="alt" onclick="exportApp()">Export as app</button>
    <button class="go" onclick="exportDoc()">Export my work</button>
  </div>
</header>

<main>
<section class="brief wide"><h2 id="ltitle"></h2><div id="lbrief"></div></section>

<section>
  <h2>Your app</h2>
  <label for="prompt">System prompt (the instructions the AI reads before every question)</label>
  <textarea id="prompt" style="min-height:130px"></textarea>
  <div class="hint" id="plock"></div>

  <label for="temp">Temperature: <b id="tval"></b></label>
  <input id="temp" type="range" min="0" max="1" step="0.1">
  <div class="hint" id="tlock"></div>

  <label for="predict">Before you run: what do you think it will say?</label>
  <input id="predict">

  <label>Inputs (up to five)</label>
  <div class="inps" id="inps"></div>

  <div class="row">
    <div><label for="reps" style="margin-top:0">Run each input</label>
      <select id="reps"><option value="1">1 time</option><option value="2">2 times</option><option value="3">3 times</option></select></div>
    <button id="runb" onclick="run()">Run</button>
  </div>
  <div id="status" aria-live="polite"></div>
</section>

<section>
  <h2>Output</h2>
  <div class="wrap"><table id="out"><tr><td class="hint">Answers appear here.</td></tr></table></div>
  <label for="notes">What did you notice? (goes in your export)</label>
  <textarea id="notes"></textarea>
  <details><summary id="logsum">Run log</summary><div class="wrap"><table id="logt"></table></div></details>
</section>

<section class="stretch wide"><h2>Stretch (optional)</h2><div id="lstretch"></div></section>
</main>

<script>
const ENDPOINT = "https://hfproxy.xu-yangen.workers.dev";
const MAX_TOKENS = 88, PAUSE = 400;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {get:k => {try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v) => {try{localStorage.setItem(k,v)}catch(e){}}};

const GOOD = "You are Bin Buddy, a helper for Queensland households. The user names a household item. Reply with exactly one of: YELLOW (recycling), RED (general waste) or GREEN (garden waste). Then give a reason of ten words or fewer.";
const LABS = {
 a:{t:"W1L1a: Prompt craft, improve the prompt", prompt:"You help with bins. Say which bin the item goes in.", lockP:false, temp:0.1, lockT:true, reps:1,
    inputs:["glass jar","grass clippings","greasy pizza box"],
    brief:"<p>Bin Buddy tells people which bin an item goes in. Right now its instructions are weak.</p><p><b>Your mission:</b> rewrite the system prompt so Bin Buddy answers with one bin colour (YELLOW, RED or GREEN) and a short reason. Predict, run, read, change, run again.</p>",
    stretch:"Make Bin Buddy answer in five words or fewer, and still be correct."},
 b:{t:"W1L1b: Bad prompt, too vague (locked)", prompt:"Tell the user about the thing they type. Be helpful.", lockP:true, temp:0.1, lockT:true, reps:1,
    inputs:["glass jar","pizza box","batteries"],
    brief:"<p>This prompt is locked. You can change the inputs, but not the instructions.</p><p><b>Your mission:</b> run it, then write down at least three things wrong with the answers.</p>",
    stretch:"Write a better version of this prompt on paper, then test it in lab a."},
 c:{t:"W1L1c: Bad prompt, conflicting orders (locked)", prompt:"Reply in exactly one word. Always explain your reasoning in full detail. Never use more than three words.", lockP:true, temp:0.1, lockT:true, reps:1,
    inputs:["glass jar","nappy"],
    brief:"<p>Two of these instructions fight each other.</p><p><b>Your mission:</b> predict which instruction the AI will obey, then run it. Were you right?</p>",
    stretch:"Change one sentence in your head so the instructions agree. Which one did you remove?"},
 d:{t:"W1L1d: Temperature, strict at 0.1 (locked)", prompt:GOOD, lockP:true, temp:0.1, lockT:true, reps:3,
    inputs:["greasy pizza box"],
    brief:"<p><b>Temperature</b> controls how adventurous the AI is when it picks each next word. Near 0, it picks the most likely word every time. Near 1, it is willing to pick less likely words.</p><p><b>Your mission:</b> run the same input three times. How similar are the answers?</p>",
    stretch:"Find an input where even 0.1 gives you different answers."},
 e:{t:"W1L1e: Temperature, wild at 1.0 (locked)", prompt:GOOD, lockP:true, temp:1.0, lockT:true, reps:3,
    inputs:["greasy pizza box"],
    brief:"<p>Same prompt and same input as lab d, but the temperature is 1.0.</p><p><b>Your mission:</b> predict how the answers will differ from lab d, then run it. Describe the difference in your notes.</p>",
    stretch:"Write one sentence about when you would want a high temperature (for example, writing a poem) and when you would not."},
 f:{t:"W1L1f: Temperature explorer", prompt:GOOD, lockP:false, temp:0.5, lockT:false, reps:3,
    inputs:["greasy pizza box","old toaster"],
    brief:"<p>Now you are in control of the temperature.</p><p><b>Your mission:</b> try 0.1, 0.5 and 1.0 with the same inputs. Which setting suits Bin Buddy, and why?</p>",
    stretch:"Find the lowest temperature where Bin Buddy first gives a different answer to the same input."}
};

// ── State ─────────────────────────────────────────────────
let who = store.get("aib-name") || "";
let S = {lab:"a", edits:{}, inputs:{}, notes:{}, log:[]};
try{ const s = JSON.parse(store.get("aib-W1L1")); if(s && s.lab) S = s; }catch(e){}
const save = () => store.set("aib-W1L1", JSON.stringify(S));
const inputEls = () => [...document.querySelectorAll(".inp")];

function setName(){
  const v = $("minput").value.trim().replace(/[^A-Za-z\u00C0-\u024F' -]/g,"");
  if(v.length < 2){ $("merr").textContent = "Please enter your first name (at least 2 letters)."; return; }
  who = v; store.set("aib-name", who); $("modal").classList.add("hidden"); showWho();
}
function changeName(){ $("minput").value = who; $("modal").classList.remove("hidden"); }
function showWho(){ $("who").innerHTML = who ? esc(who)+" <a onclick=\"changeName()\">change</a>" : ""; }

// ── Lab switching ─────────────────────────────────────────
function collect(){
  const L = LABS[S.lab];
  if(!L.lockP || !L.lockT){ S.edits[S.lab] = {prompt:$("prompt").value, temp:+$("temp").value}; }
  S.inputs[S.lab] = inputEls().map(i => i.value);
  S.notes[S.lab] = $("notes").value; save();
}
function tempWord(v){ return v+" ("+(v<=0.3?"strict":v<=0.7?"balanced":"wild")+")"; }
function render(){
  const k = S.lab, L = LABS[k], e = S.edits[k] || {};
  $("labsel").value = k; $("ltitle").textContent = L.t; $("lbrief").innerHTML = L.brief; $("lstretch").textContent = L.stretch;
  $("prompt").value = L.lockP ? L.prompt : (e.prompt ?? L.prompt); $("prompt").readOnly = L.lockP;
  $("plock").textContent = L.lockP ? "Locked in this lab. Read it, then run it." : "";
  const t = L.lockT ? L.temp : (e.temp ?? L.temp);
  $("temp").value = t; $("temp").disabled = L.lockT; $("tval").textContent = tempWord(t);
  $("tlock").textContent = L.lockT ? "Fixed in this lab." : "";
  const vals = S.inputs[k] || L.inputs;
  $("inps").innerHTML = [0,1,2,3,4].map(i => '<input class="inp" aria-label="Input '+(i+1)+'" placeholder="Input '+(i+1)+'" value="'+esc(vals[i]||"")+'">').join("");
  $("reps").value = L.reps; $("notes").value = S.notes[k] || ""; $("predict").value = "";
  $("out").innerHTML = '<tr><td class="hint">Answers appear here.</td></tr>'; $("status").textContent = "";
  renderLog();
}
function switchLab(k){ collect(); S.lab = k; save(); render(); }
function renderLog(){
  const rows = S.log.filter(r => r.lab === S.lab);
  $("logsum").textContent = "Run log for this lab ("+rows.length+" runs)";
  $("logt").innerHTML = "<tr><th>Temp</th><th>Predicted</th><th>Input</th><th>Run</th><th>Answer</th></tr>" +
    rows.map(r => "<tr><td>"+r.temp+"</td><td>"+esc(r.pred||"")+"</td><td>"+esc(r.inp)+"</td><td>"+r.run+"</td><td>"+esc(r.got)+"</td></tr>").join("");
}
document.addEventListener("input", e => {
  if(e.target.id === "temp") $("tval").textContent = tempWord(+e.target.value);
  if(["prompt","temp","notes"].includes(e.target.id) || e.target.classList.contains("inp")) collect();
});

// ── Running ───────────────────────────────────────────────
async function llm(system, input, temp){
  try{
    const r = await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:[{role:"system",content:system},{role:"user",content:input}], model:"llama-3.1-8b-instant", max_tokens:MAX_TOKENS, temperature:temp})});
    if(!r.ok) throw new Error((await r.json()).error?.message || "Request failed");
    return (await r.json()).choices[0].message.content.trim();
  }catch(e){ return "ERROR: "+e.message; }
}
async function run(){
  const prompt = $("prompt").value.trim(), temp = +$("temp").value, reps = +$("reps").value, pred = $("predict").value.trim();
  const ins = inputEls().map(i => i.value.trim()).filter(Boolean);
  if(!prompt || !ins.length){ $("status").textContent = "Write a system prompt and at least one input."; return; }
  collect(); $("runb").disabled = true; $("status").textContent = "Running…";
  const head = "<tr><th>Input</th><th>Run</th><th>Answer</th></tr>"; let rows = "";
  $("out").innerHTML = head;
  for(const inp of ins) for(let k = 1; k <= reps; k++){
    const got = await llm(prompt, inp, temp);
    rows += "<tr><td>"+esc(inp)+"</td><td>"+k+"</td><td>"+esc(got)+"</td></tr>";
    $("out").innerHTML = head + rows;
    S.log.push({lab:S.lab, temp, pred, inp, run:k, got, prompt}); await sleep(PAUSE);
  }
  $("predict").value = ""; $("status").textContent = "Done. Now write what you noticed."; save(); renderLog(); $("runb").disabled = false;
}

// ── Exports ───────────────────────────────────────────────
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const fname = () => (who || "Student").replace(/\s+/g,"-");
function exportDoc(){
  if(!who){ changeName(); return; }
  collect(); let b = "";
  for(const k in LABS){
    const rows = S.log.filter(r => r.lab === k), note = S.notes[k] || "";
    if(!rows.length && !note) continue;
    b += "<h2>"+esc(LABS[k].t)+"</h2>";
    if(rows.length) b += "<p><b>Prompt:</b> "+esc(rows[rows.length-1].prompt)+"</p><table border='1' cellpadding='4' style='border-collapse:collapse'><tr><th>Temp</th><th>Predicted</th><th>Input</th><th>Run</th><th>Answer</th></tr>" +
      rows.map(r => "<tr><td>"+r.temp+"</td><td>"+esc(r.pred||"")+"</td><td>"+esc(r.inp)+"</td><td>"+r.run+"</td><td>"+esc(r.got)+"</td></tr>").join("") + "</table>";
    if(note) b += "<p><b>What I noticed:</b> "+esc(note)+"</p>";
  }
  if(!b){ alert("Run something first, so there is work to export."); return; }
  download(fname()+"-W1L1.doc", "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'><title>"+esc(who)+" W1L1</title></head><body style='font-family:Calibri,sans-serif'><h1>"+esc(who)+": W1L1 run log</h1>"+b+"</body></html>", "application/msword");
}
function exportApp(){
  if(!who){ changeName(); return; }
  if(LABS[S.lab].lockP){ alert("This prompt is locked. Switch to lab a or lab f to export an app."); return; }
  if(!$("prompt").value.trim()){ alert("Write a system prompt first."); return; }
  const cfg = {name:"Bin Buddy", prompt:$("prompt").value, temp:+$("temp").value, endpoint:ENDPOINT, max:MAX_TOKENS};
  const j = JSON.stringify(cfg).replace(/</g,"\\u003c");
  download(fname()+"-BinBuddy-app.html", CONSUMER.replace("__CFG__",() => j), "text/html");
}
const CONSUMER = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bin Buddy</title><style>
body{margin:0;background:#121212;color:#e0e0e0;font:16px/1.6 'Segoe UI',Tahoma,sans-serif;display:flex;justify-content:center;padding:24px}
.c{max-width:520px;width:100%}h1{color:#4EC9B0;margin:0 0 4px}p{color:#aaa;margin:0 0 16px}
textarea{width:100%;min-height:80px;background:#1e1e1e;color:#eee;border:2px solid #333;border-radius:8px;padding:10px;font:inherit;box-sizing:border-box}
textarea:focus{outline:none;border-color:#4EC9B0}
button{margin-top:10px;background:#ce3c3c;color:#fff;border:0;border-radius:6px;padding:10px 26px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{background:#555}#o{margin-top:18px;padding:14px;background:#1e1e1e;border-left:4px solid #4EC9B0;border-radius:6px;min-height:24px;white-space:pre-wrap}
</style></head><body><div class="c"><h1>Bin Buddy</h1><p>Type a household item and find out which bin it goes in.</p><textarea id="i" maxlength="300" placeholder="Type an item"></textarea><button id="b">Ask</button><div id="o" aria-live="polite"></div></div>
<script>
const C=__CFG__,$=id=>document.getElementById(id);
$("b").onclick=async()=>{
  const v=$("i").value.trim();if(!v)return;
  $("b").disabled=true;$("o").textContent="Thinking…";
  try{
    const r=await fetch(C.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"system",content:C.prompt},{role:"user",content:v}],model:"llama-3.1-8b-instant",max_tokens:C.max,temperature:C.temp})});
    if(!r.ok)throw new Error("The service is busy. Please try again shortly.");
    $("o").textContent=(await r.json()).choices[0].message.content.trim();
  }catch(e){$("o").textContent=e.message;}
  setTimeout(()=>{$("b").disabled=false;},3000);
};
<\/script></body></html>`;

// ── Start up ──────────────────────────────────────────────
$("labsel").innerHTML = Object.keys(LABS).map(k => '<option value="'+k+'">'+esc(LABS[k].t)+'</option>').join("");
showWho(); if(who) $("modal").classList.add("hidden");
render();
</script>
</body>
</html>
