<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 9 Capstone project</title>
<style>
:root{--bg:#121212;--pn2:#252526;--bd:#3a3a3a;--tx:#e0e0e0;--mut:#9a9a9a;--ac:#4EC9B0;--rd:#ce3c3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Segoe UI',Tahoma,sans-serif}
header{background:#1f1f1f;border-bottom:2px solid var(--rd);padding:16px 18px}
h1{font-size:20px;margin:0}
main{max-width:720px;margin:0 auto;padding:18px 14px}
.week{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.week b{color:var(--ac)}
.links{display:flex;gap:10px;flex-wrap:wrap}
a{display:inline-block;background:#333;color:var(--tx);text-decoration:none;border-radius:4px;padding:8px 16px;font-weight:700}
a:hover,a:focus-visible{background:var(--ac);color:#1e1e1e;outline:none}
@media(max-width:480px){.week{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Year 9 Capstone project</h1></header>
<main id="list"></main>
<script>
const W = [
 [1, [["Lesson 1","W1L1.html"],["Lesson 2","W1L2.html"]]],
 [2, [["Lesson 1","W2L1.html"],["Lesson 2","W2L2.html"]]],
 [3, [["Lesson 1","W3L1.html"],["Lesson 2","W3L2.html"]]],
 [4, [["Lesson 1","W4L1.html"],["Lesson 2","W4L2.html"]]],
 [5, [["Project","W5.html"]]],
 [6, [["Lesson 1","W6L1.html"],["Lesson 2","W6L2.html"]]],
 [7, [["Lesson 1","W7L1.html"],["Lesson 2","W7L2.html"]]],
 [8, [["Lessons 1 and 2","W8.html"]]]
];
document.getElementById("list").innerHTML = W.map(([n, ls]) =>
  '<div class="week"><b>Week '+n+'</b><div class="links">'+ls.map(([t, u]) => '<a href="'+u+'">'+t+'</a>').join("")+'</div></div>').join("");
</script>
</body>
</html>
