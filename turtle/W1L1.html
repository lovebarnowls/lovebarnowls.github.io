<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yang's Python Turtle IDE - Digitech Labs</title>
    
    <!-- Dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>

    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --border: #333;
            --accent: #4EC9B0;
            --text: #d4d4d4;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: var(--bg-dark); color: var(--text); }
        
        /* Header */
        .header { height: 50px; background: var(--bg-panel); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .logo { font-weight: bold; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 15px; }
        .lab-selector { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        button { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; text-transform: uppercase; }
        .btn-run { background-color: #28a745; color: white; }
        .btn-run:hover { background-color: #218838; }
        .btn-check { background-color: #007acc; color: white; }
        .btn-check:hover { background-color: #005f9e; }
        .btn-save { background-color: #3e3e3e; color: white; border: 1px solid #555; }
        .btn-save:hover { background-color: #505050; }

        /* Main Layout */
        .main-container { display: flex; height: calc(100% - 50px); width: 100vw; }
        
        /* Left Column: Code + Console */
        .left-col { width: 45%; height: 100%; display: flex; flex-direction: column; border-right: 2px solid var(--border); }
        
        /* Editor Area (Top Left - 70%) */
        #editor-wrapper { height: 70%; display: flex; flex-direction: column; border-bottom: 2px solid var(--border); }
        .panel-header { background: #2d2d2d; padding: 5px 15px; font-size: 12px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
        #code-input { flex-grow: 1; background: var(--bg-dark); color: #d4d4d4; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; border: none; outline: none; resize: none; line-height: 1.5; }

        /* Bottom Left Panel (30% Height) */
        .bottom-panel { height: 30%; display: flex; flex-direction: row; } /* Horizontal Layout */
        
        /* Console (2/3 Width) */
        #console-wrapper { width: 66.6%; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        #console-output { flex-grow: 1; background: #000; color: #00ff00; padding: 10px; font-family: 'Consolas', monospace; font-size: 12px; overflow-y: auto; margin: 0; white-space: pre-wrap; }
        
        /* Sample Image (1/3 Width) */
        #sample-wrapper { width: 33.3%; background: #fff; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #sample-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .no-image-text { color: #333; font-size: 12px; font-style: italic; }

        /* Right Column: Canvas */
        #output-container { width: 55%; height: 100%; display: flex; flex-direction: column; background-color: #fff; position: relative; }
        #canvas-wrapper { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; background: #fff;}
        #my-canvas { width: 100%; height: 100%; }

        /* Marker Overlay */
        #marker-result {
            position: absolute; top: 20px; right: 20px; 
            background: rgba(0,0,0,0.8); color: white; 
            padding: 15px; border-radius: 8px; 
            display: none; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 200px;
        }
        .marker-pass { border-left: 5px solid #28a745; }
        .marker-fail { border-left: 5px solid #dc3545; }
        .marker-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .marker-detail { font-size: 12px; color: #ccc; }

        /* Toggle Switch */
        .toggle-container { font-size: 12px; display: flex; align-items: center; gap: 5px; color: #ccc; cursor: pointer; user-select: none; background: #333; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        Yang's IDE
        <select id="lab-select" class="lab-selector" onchange="loadLab()">
            <!-- Options populated by JS -->
        </select>
    </div>
    <div class="controls">
        <label class="toggle-container">
            <input type="checkbox" id="skip-anim"> ⚡ Instant
        </label>
        <button class="btn-run" onclick="runPython()">▶ Run</button>
        <button class="btn-check" onclick="checkAnswer()">✔ Auto-Check</button>
        <button class="btn-save" onclick="downloadScript()">💾 Save .txt</button>
    </div>
</div>

<div class="main-container">
    <!-- LEFT SIDE -->
    <div class="left-col">
        <!-- Code Editor -->
        <div id="editor-wrapper">
            <div class="panel-header">Python Code</div>
            <textarea id="code-input" spellcheck="false"></textarea>
        </div>

        <!-- Bottom Panel (Console + Sample Side-by-Side) -->
        <div class="bottom-panel">
            <!-- Console -->
            <div id="console-wrapper">
                <div class="panel-header">Console Output</div>
                <pre id="console-output">Ready...</pre>
            </div>
            
            <!-- Sample Image -->
            <div id="sample-wrapper">
                <div class="panel-header" style="position:absolute; top:0; left:0; width:100%; background:rgba(255,255,255,0.9); color:#333; z-index:10;">Target</div>
                <span class="no-image-text">No sample</span>
                <img id="sample-img" src="" alt="Target">
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div id="output-container">
        <div id="canvas-wrapper">
            <div id="my-canvas"></div>
        </div>
        
        <!-- Auto Marker Result Popup -->
        <div id="marker-result">
            <div class="marker-title" id="marker-title">Result</div>
            <div class="marker-detail" id="marker-detail">Details...</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // ==========================================
    // LAB DATA CONFIGURATION
    // ==========================================
    const LAB_DATA = [
        {
            id: 1,
            title: "Lab 1: The Square",
            description: "Draw a square with side length 100.",
            code: "import turtle\n\nt = turtle.Turtle()\nt.speed(0)\n\n# Draw a square\nfor i in range(4):\n    t.forward(100)\n    t.right(90)\n\nprint('Square complete')",
            targetImage: "1.png", 
            checkColor: false,    
            tolerance: 10         
        },
        {
            id: 2,
            title: "Lab 2: Equilateral Triangle",
            description: "Draw a triangle with side length 150.",
            code: "import turtle\n\nt = turtle.Turtle()\nt.speed(0)\n\n# Draw Triangle\nfor i in range(3):\n    t.forward(150)\n    t.left(120)\n\nprint('Triangle complete')",
            targetImage: "2.png",
            checkColor: false,
            tolerance: 10
        },
        {
            id: 3,
            title: "Lab 3: Colored Row",
            description: "Draw 3 red squares in a row.",
            code: "import turtle\n\nt = turtle.Turtle()\nt.speed(0)\nt.color('red')\n\nfor sq in range(3):\n    for i in range(4):\n        t.forward(50)\n        t.right(90)\n    t.penup()\n    t.forward(70)\n    t.pendown()\n\nprint('Row complete')",
            targetImage: "3.png",
            checkColor: true,     
            tolerance: 10
        }
    ];

    // ==========================================
    // CORE FUNCTIONS
    // ==========================================

    function outf(text) {
        var mypre = document.getElementById("console-output");
        mypre.innerHTML += text;
        mypre.scrollTop = mypre.scrollHeight;
    }

    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
            throw "File not found: '" + x + "'";
        return Sk.builtinFiles["files"][x];
    }

    function runPython() {
        var userCode = document.getElementById("code-input").value;
        var skipAnim = document.getElementById("skip-anim").checked;
        
        document.getElementById("console-output").innerHTML = ""; 
        document.getElementById("my-canvas").innerHTML = "";
        document.getElementById("marker-result").style.display = "none";

        var finalCode = userCode;
        if (skipAnim) {
            finalCode = "import turtle\nturtle.speed(0)\nturtle.tracer(0, 0)\n" + userCode + "\nturtle.update()";
        }

        var wrapper = document.getElementById("canvas-wrapper");
        
        Sk.configure({ 
            output: outf, 
            read: builtinRead, 
            __future__: Sk.python3 
        });

        Sk.TurtleGraphics = { 
            target: 'my-canvas', 
            width: wrapper.offsetWidth, 
            height: wrapper.offsetHeight,
            animate: !skipAnim 
        };

        var myPromise = Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>", false, finalCode, true);
        });

        myPromise.then(function() { 
            console.log('Execution finished.'); 
        }, function(err) {
            outf("\n<span style='color:#ff5555'>Error: " + err.toString() + "</span>");
        });
    }

    function downloadScript() {
        const code = document.getElementById("code-input").value;
        const blob = new Blob([code], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "my_turtle_program.txt"; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // ==========================================
    // LAB MANAGEMENT
    // ==========================================

    function initLabs() {
        const select = document.getElementById("lab-select");
        LAB_DATA.forEach((lab, index) => {
            let option = document.createElement("option");
            option.value = index;
            option.text = lab.title;
            select.appendChild(option);
        });
        loadLab(); 
    }

    function loadLab() {
        const index = document.getElementById("lab-select").value;
        const lab = LAB_DATA[index];
        
        document.getElementById("code-input").value = lab.code;
        
        const imgEl = document.getElementById("sample-img");
        const noImgText = document.querySelector(".no-image-text");
        
        if (lab.targetImage) {
            imgEl.src = lab.targetImage;
            imgEl.style.display = "block";
            noImgText.style.display = "none";
            
            imgEl.onerror = function() { 
                this.style.display = "none"; 
                noImgText.style.display = "block";
                noImgText.innerText = "Img not found";
            };
        } else {
            imgEl.style.display = "none";
            noImgText.style.display = "block";
            noImgText.innerText = "No visual target";
        }

        document.getElementById("console-output").innerHTML = "Loaded: " + lab.title;
        document.getElementById("marker-result").style.display = "none";
        document.getElementById("my-canvas").innerHTML = "";
    }

    // ==========================================
    // SMART AUTO MARKER LOGIC
    // ==========================================

    function getBoundingBox(imageData, width, height) {
        let minX = width, minY = height, maxX = 0, maxY = 0;
        let hasContent = false;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const i = (y * width + x) * 4;
                const r = imageData.data[i];
                const g = imageData.data[i+1];
                const b = imageData.data[i+2];
                
                // Check if pixel is NOT white/background (allow small variance for anti-aliasing)
                if (r < 240 || g < 240 || b < 240) {
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                    hasContent = true;
                }
            }
        }
        
        if (!hasContent) return null;
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function checkAnswer() {
        const index = document.getElementById("lab-select").value;
        const lab = LAB_DATA[index];
        const resultBox = document.getElementById("marker-result");
        const title = document.getElementById("marker-title");
        const detail = document.getElementById("marker-detail");

        if (!lab.targetImage) {
            alert("This lab does not have an image to check against.");
            return;
        }

        const studentCanvas = document.querySelector("#my-canvas canvas");
        if (!studentCanvas) {
            alert("Please run your code first!");
            return;
        }

        const targetImg = document.getElementById("sample-img");
        if (!targetImg.complete || targetImg.naturalWidth === 0) {
            alert("Target image hasn't loaded yet.");
            return;
        }

        // Create offscreen canvas for target
        const compCanvas = document.createElement("canvas");
        compCanvas.width = studentCanvas.width;
        compCanvas.height = studentCanvas.height;
        const ctx = compCanvas.getContext("2d");

        // Draw target image stretched to fit
        ctx.drawImage(targetImg, 0, 0, compCanvas.width, compCanvas.height);

        const sCtx = studentCanvas.getContext("2d");
        const sData = sCtx.getImageData(0, 0, studentCanvas.width, studentCanvas.height);
        const tData = ctx.getImageData(0, 0, compCanvas.width, compCanvas.height);

        // 1. Find Bounding Boxes
        const sBox = getBoundingBox(sData, studentCanvas.width, studentCanvas.height);
        const tBox = getBoundingBox(tData, compCanvas.width, compCanvas.height);

        if (!sBox) {
            alert("Your canvas is empty!");
            return;
        }
        if (!tBox) {
            alert("Target image is empty/white!");
            return;
        }

        // 2. Calculate Offset (Alignment)
        // We want to shift the Target comparison window so its top-left matches Student's top-left
        const offsetX = sBox.x - tBox.x;
        const offsetY = sBox.y - tBox.y;

        // 3. Compare Pixels with Offset
        let mismatchPixels = 0;
        let comparedPixels = 0;
        const threshold = 40; // Color difference threshold

        // We only need to iterate over the area where the student drew something
        // To be safe, we iterate the whole canvas but apply offset logic
        for (let y = 0; y < studentCanvas.height; y++) {
            for (let x = 0; x < studentCanvas.width; x++) {
                const sIdx = (y * studentCanvas.width + x) * 4;
                
                // Calculate corresponding target coordinate
                const tx = x - offsetX;
                const ty = y - offsetY;

                // If target coordinate is out of bounds, we treat it as background (white)
                let tR=255, tG=255, tB=255;
                
                if (tx >= 0 && tx < compCanvas.width && ty >= 0 && ty < compCanvas.height) {
                    const tIdx = (ty * compCanvas.width + tx) * 4;
                    tR = tData.data[tIdx];
                    tG = tData.data[tIdx+1];
                    tB = tData.data[tIdx+2];
                }

                const sR = sData.data[sIdx];
                const sG = sData.data[sIdx+1];
                const sB = sData.data[sIdx+2];

                // Skip completely white background pixels in both to avoid noise
                if (sR > 250 && sG > 250 && sB > 250 && tR > 250 && tG > 250 && tB > 250) continue;

                comparedPixels++;

                if (!lab.checkColor) {
                    // Grayscale comparison
                    const sGray = 0.299*sR + 0.587*sG + 0.114*sB;
                    const tGray = 0.299*tR + 0.587*tG + 0.114*tB;
                    if (Math.abs(sGray - tGray) > threshold) mismatchPixels++;
                } else {
                    // Color comparison
                    if (Math.abs(sR - tR) > threshold || Math.abs(sG - tG) > threshold || Math.abs(sB - tB) > threshold) {
                        mismatchPixels++;
                    }
                }
            }
        }

        // Prevent division by zero
        if (comparedPixels === 0) comparedPixels = 1;

        const errorPercent = (mismatchPixels / comparedPixels) * 100;
        const passed = errorPercent <= lab.tolerance;

        resultBox.style.display = "block";
        resultBox.className = passed ? "marker-pass" : "marker-fail";
        title.innerText = passed ? "✅ PASSED" : "❌ FAILED";
        detail.innerHTML = `Difference: ${errorPercent.toFixed(1)}%<br>Allowed: ${lab.tolerance}%<br>Aligned Start Points automatically.`;
    }

    window.onload = initLabs;
</script>

</body>
</html>
