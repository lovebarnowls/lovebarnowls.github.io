<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yang's Python Turtle IDE - Digitech Labs</title>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>

    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --border: #333;
            --accent: #4EC9B0;
            --text: #d4d4d4;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: var(--bg-dark); color: var(--text); }
        
        .header { height: 50px; background: var(--bg-panel); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .logo { font-weight: bold; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 15px; }
        .lab-selector { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        button { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; text-transform: uppercase; }
        .btn-run { background-color: #28a745; color: white; }
        .btn-run:hover { background-color: #218838; }
        .btn-check { background-color: #007acc; color: white; }
        .btn-check:hover { background-color: #005f9e; }
        .btn-check:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        .btn-save { background-color: #3e3e3e; color: white; border: 1px solid #555; }
        .btn-save:hover { background-color: #505050; }

        .main-container { display: flex; height: calc(100% - 50px); width: 100vw; }
        
        .left-col { width: 45%; height: 100%; display: flex; flex-direction: column; border-right: 2px solid var(--border); }
        
        #editor-wrapper { height: 70%; display: flex; flex-direction: column; border-bottom: 2px solid var(--border); }
        .panel-header { background: #2d2d2d; padding: 5px 15px; font-size: 12px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        #code-input { flex-grow: 1; background: var(--bg-dark); color: #d4d4d4; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; border: none; outline: none; resize: none; line-height: 1.5; }

        .bottom-panel { height: 30%; display: flex; flex-direction: row; }
        
        #console-wrapper { width: 66.6%; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        #console-output { flex-grow: 1; background: #000; color: #00ff00; padding: 10px; font-family: 'Consolas', monospace; font-size: 12px; overflow-y: auto; margin: 0; white-space: pre-wrap; }
        
        #sample-wrapper { width: 33.3%; background: #fff; position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; overflow: hidden; }
        #sample-img { max-width: 100%; max-height: calc(100% - 28px); object-fit: contain; margin-top: 28px; }
        .no-image-text { color: #333; font-size: 12px; font-style: italic; margin-top: 28px; }

        #output-container { width: 55%; height: 100%; display: flex; flex-direction: column; background-color: #fff; position: relative; }
        #canvas-wrapper { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; background: #fff; }
        #my-canvas { width: 100%; height: 100%; }

        /* Hidden offscreen renders for solution canvases */
        #offscreen-container { position: absolute; left: -9999px; top: -9999px; visibility: hidden; pointer-events: none; }
        .offscreen-slot { width: 800px; height: 600px; background: #fff; }

        #marker-result {
            position: absolute; top: 20px; right: 20px; 
            background: rgba(0,0,0,0.85); color: white; 
            padding: 15px; border-radius: 8px; 
            display: none; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 200px;
        }
        .marker-pass { border-left: 5px solid #28a745; }
        .marker-fail { border-left: 5px solid #dc3545; }
        .marker-pending { border-left: 5px solid #ffc107; }
        .marker-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .marker-detail { font-size: 12px; color: #ccc; }

        .toggle-container { font-size: 12px; display: flex; align-items: center; gap: 5px; color: #ccc; cursor: pointer; user-select: none; background: #333; padding: 4px 8px; border-radius: 4px; }

        #prerender-status { font-size: 11px; color: #888; padding: 2px 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        Yang's IDE
        <select id="lab-select" class="lab-selector" onchange="loadLab()"></select>
    </div>
    <div class="controls">
        <span id="prerender-status">Preparing solutions...</span>
        <label class="toggle-container">
            <input type="checkbox" id="skip-anim"> ⚡ Instant
        </label>
        <button class="btn-run" onclick="runPython()">▶ Run</button>
        <button class="btn-check" id="btn-check" onclick="checkAnswer()" disabled>✔ Auto-Check</button>
        <button class="btn-save" onclick="downloadScript()">💾 Save .txt</button>
    </div>
</div>

<div class="main-container">
    <div class="left-col">
        <div id="editor-wrapper">
            <div class="panel-header">Python Code</div>
            <textarea id="code-input" spellcheck="false"></textarea>
        </div>
        <div class="bottom-panel">
            <div id="console-wrapper">
                <div class="panel-header">Console Output</div>
                <pre id="console-output">Ready...</pre>
            </div>
            <div id="sample-wrapper">
                <div class="panel-header" style="position:absolute; top:0; left:0; width:100%; background:rgba(255,255,255,0.9); color:#333; z-index:10; box-sizing:border-box;">Target</div>
                <span class="no-image-text" id="no-img-text">Preparing...</span>
                <img id="sample-img" style="display:none; max-width:100%; max-height:calc(100% - 28px); object-fit:contain; margin-top:28px;" alt="Target">
            </div>
        </div>
    </div>

    <div id="output-container">
        <div id="canvas-wrapper">
            <div id="my-canvas"></div>
        </div>
        <div id="marker-result">
            <div class="marker-title" id="marker-title">Result</div>
            <div class="marker-detail" id="marker-detail">Details...</div>
        </div>
    </div>
</div>

<!-- Hidden container for solution pre-renders -->
<div id="offscreen-container"></div>

<script type="text/javascript">

    // ==========================================
    // LAB DATA — add solutionCode to each lab.
    // The starter 'code' is what the student sees.
    // 'solutionCode' is rendered silently at load.
    // 'checkColor' toggles colour-aware diffing.
    // 'tolerance' is the allowed % pixel difference.
    // ==========================================
    const LAB_DATA = [
        {
            id: 1,
            title: "Lab 1: The Square",
            code: "import turtle\n\nt = turtle.Turtle()\nt.speed(3)\n\n# Draw a square with side length 100\n# Hint: a square has 4 sides and turns 90 degrees\n\nprint('Square complete')",
            solutionCode: "import turtle\n\nt = turtle.Turtle()\nfor i in range(4):\n    t.forward(100)\n    t.right(90)",
            checkColor: false,
            tolerance: 10
        },
        {
            id: 2,
            title: "Lab 2: Equilateral Triangle",
            code: "import turtle\n\nt = turtle.Turtle()\nt.speed(3)\n\n# Draw a triangle with side length 150\n# Hint: a triangle has 3 sides. What angle does it turn?\n\nprint('Triangle complete')",
            solutionCode: "import turtle\n\nt = turtle.Turtle()\nfor i in range(3):\n    t.forward(150)\n    t.left(120)",
            checkColor: false,
            tolerance: 10
        },
        {
            id: 3,
            title: "Lab 3: Coloured Row",
            code: "import turtle\n\nt = turtle.Turtle()\nt.speed(3)\n\n# Draw 3 red squares in a row\n# Each square has side length 50, spaced 70 apart\n\nprint('Row complete')",
            solutionCode: "import turtle\n\nt = turtle.Turtle()\nt.color('red')\nfor sq in range(3):\n    for i in range(4):\n        t.forward(50)\n        t.right(90)\n    t.penup()\n    t.forward(70)\n    t.pendown()",
            checkColor: true,
            tolerance: 10
        }
    ];

    // ==========================================
    // SOLUTION RENDER STATE
    // Stores { canvas, dataURL } per lab index
    // ==========================================
    const solutionRenders = {};
    let rendersComplete = 0;

    // ==========================================
    // SKULPT HELPERS
    // ==========================================
    function outf(text) {
        var mypre = document.getElementById("console-output");
        mypre.innerHTML += text;
        mypre.scrollTop = mypre.scrollHeight;
    }

    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
            throw "File not found: '" + x + "'";
        return Sk.builtinFiles["files"][x];
    }

    // Wraps solution code so it runs at speed(0) with tracer off for instant render
    function wrapInstant(code) {
        return "import turtle\nturtle.speed(0)\nturtle.tracer(0,0)\n" + code + "\nturtle.update()";
    }

    // ==========================================
    // PRE-RENDER ALL SOLUTIONS AT PAGE LOAD
    // Each solution is rendered sequentially into
    // a hidden div, then the canvas is captured.
    // ==========================================
    function prerenderSolutions() {
        const status = document.getElementById("prerender-status");
        renderNext(0);

        function renderNext(index) {
            if (index >= LAB_DATA.length) {
                allRendersComplete();
                return;
            }

            status.textContent = "Preparing " + (index + 1) + "/" + LAB_DATA.length + "...";

            const lab = LAB_DATA[index];
            const slot = document.createElement("div");
            slot.id = "offscreen-" + index;
            slot.style.cssText = "width:800px;height:600px;background:#fff;position:relative;";
            document.getElementById("offscreen-container").appendChild(slot);

            Sk.configure({ output: function(){}, read: builtinRead, __future__: Sk.python3 });
            Sk.TurtleGraphics = {
                target: "offscreen-" + index,
                width: 800,
                height: 600,
                animate: false
            };

            const code = wrapInstant(lab.solutionCode);

            Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            }).then(function() {
                // Small delay to ensure canvas has painted
                setTimeout(function() {
                    const canvas = slot.querySelector("canvas");
                    if (canvas) {
                        // Store the canvas reference and a data URL for the thumbnail
                        try {
                            const dataURL = canvas.toDataURL("image/png");
                            solutionRenders[index] = { canvas: canvas, dataURL: dataURL };
                        } catch(e) {
                            console.warn("Could not capture solution canvas for lab " + index, e);
                            solutionRenders[index] = null;
                        }
                    } else {
                        solutionRenders[index] = null;
                    }
                    renderNext(index + 1);
                }, 300);
            }).catch(function(err) {
                console.warn("Solution render failed for lab " + index + ":", err);
                solutionRenders[index] = null;
                renderNext(index + 1);
            });
        }
    }

    function allRendersComplete() {
        const status = document.getElementById("prerender-status");
        status.textContent = "Ready ✓";
        setTimeout(function(){ status.textContent = ""; }, 2000);

        document.getElementById("btn-check").disabled = false;

        // Update thumbnail for the currently selected lab
        updateThumbnail(document.getElementById("lab-select").value);
    }

    // ==========================================
    // THUMBNAIL DISPLAY
    // Shows the solution render in the Target panel
    // ==========================================
    function updateThumbnail(index) {
        const render = solutionRenders[index];
        const imgEl = document.getElementById("sample-img");
        const noImgText = document.getElementById("no-img-text");

        if (render && render.dataURL) {
            imgEl.src = render.dataURL;
            imgEl.style.display = "block";
            noImgText.style.display = "none";
        } else {
            imgEl.style.display = "none";
            noImgText.style.display = "block";
            noImgText.textContent = "No preview";
        }
    }

    // ==========================================
    // STUDENT CODE RUNNER
    // ==========================================
    function runPython() {
        var userCode = document.getElementById("code-input").value;
        var skipAnim = document.getElementById("skip-anim").checked;
        
        document.getElementById("console-output").innerHTML = "";
        document.getElementById("my-canvas").innerHTML = "";
        document.getElementById("marker-result").style.display = "none";

        var finalCode = skipAnim ? wrapInstant(userCode) : userCode;

        var wrapper = document.getElementById("canvas-wrapper");

        Sk.configure({ output: outf, read: builtinRead, __future__: Sk.python3 });
        Sk.TurtleGraphics = {
            target: 'my-canvas',
            width: wrapper.offsetWidth,
            height: wrapper.offsetHeight,
            animate: !skipAnim
        };

        Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>", false, finalCode, true);
        }).then(function() {
            console.log('Execution finished.');
        }, function(err) {
            outf("\n<span style='color:#ff5555'>Error: " + err.toString() + "</span>");
        });
    }

    // ==========================================
    // DOWNLOAD
    // ==========================================
    function downloadScript() {
        const code = document.getElementById("code-input").value;
        const blob = new Blob([code], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "my_turtle_program.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // ==========================================
    // LAB MANAGEMENT
    // ==========================================
    function initLabs() {
        const select = document.getElementById("lab-select");
        LAB_DATA.forEach(function(lab, index) {
            let option = document.createElement("option");
            option.value = index;
            option.text = lab.title;
            select.appendChild(option);
        });
        loadLab();
        prerenderSolutions();
    }

    function loadLab() {
        const index = parseInt(document.getElementById("lab-select").value);
        const lab = LAB_DATA[index];
        document.getElementById("code-input").value = lab.code;
        document.getElementById("console-output").innerHTML = "Loaded: " + lab.title;
        document.getElementById("marker-result").style.display = "none";
        document.getElementById("my-canvas").innerHTML = "";

        // If renders are already done, update thumbnail immediately
        if (solutionRenders.hasOwnProperty(index)) {
            updateThumbnail(index);
        } else {
            document.getElementById("sample-img").style.display = "none";
            document.getElementById("no-img-text").style.display = "block";
            document.getElementById("no-img-text").textContent = "Preparing...";
        }
    }

    // ==========================================
    // BOUNDING BOX HELPER
    // ==========================================
    function getBoundingBox(imageData, width, height) {
        let minX = width, minY = height, maxX = 0, maxY = 0;
        let hasContent = false;
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const i = (y * width + x) * 4;
                if (imageData.data[i] < 240 || imageData.data[i+1] < 240 || imageData.data[i+2] < 240) {
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                    hasContent = true;
                }
            }
        }
        if (!hasContent) return null;
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    // ==========================================
    // AUTO MARKER
    // Diffs student canvas against solution render.
    // Both canvases come from Skulpt so resolution,
    // anti-aliasing, and stroke width are identical.
    // ==========================================
    function checkAnswer() {
        const index = parseInt(document.getElementById("lab-select").value);
        const lab = LAB_DATA[index];
        const resultBox = document.getElementById("marker-result");
        const titleEl = document.getElementById("marker-title");
        const detailEl = document.getElementById("marker-detail");

        const studentCanvas = document.querySelector("#my-canvas canvas");
        if (!studentCanvas) {
            alert("Please run your code first!");
            return;
        }

        const solutionRender = solutionRenders[index];
        if (!solutionRender || !solutionRender.canvas) {
            alert("Solution reference is not available. Please reload the page.");
            return;
        }

        const solCanvas = solutionRender.canvas;

        // Both canvases should be the same size — but we normalise anyway
        // by scaling the student canvas into an offscreen canvas matching
        // the solution canvas dimensions, to eliminate any size discrepancy.
        const w = solCanvas.width;
        const h = solCanvas.height;

        const normCanvas = document.createElement("canvas");
        normCanvas.width = w;
        normCanvas.height = h;
        const normCtx = normCanvas.getContext("2d");
        normCtx.fillStyle = "#ffffff";
        normCtx.fillRect(0, 0, w, h);
        normCtx.drawImage(studentCanvas, 0, 0, w, h);

        let sData, tData;
        try {
            sData = normCtx.getImageData(0, 0, w, h);
            const solCtx = solCanvas.getContext("2d");
            tData = solCtx.getImageData(0, 0, w, h);
        } catch(e) {
            alert("Could not read canvas pixel data. This may be a browser security restriction.");
            return;
        }

        // Find bounding boxes for alignment
        const sBox = getBoundingBox(sData, w, h);
        const tBox = getBoundingBox(tData, w, h);

        if (!sBox) {
            resultBox.style.display = "block";
            resultBox.className = "marker-fail";
            titleEl.innerText = "❌ FAILED";
            detailEl.innerHTML = "Your canvas appears empty. Run your code first.";
            return;
        }

        // Offset to align top-left corners of both drawings
        const offsetX = sBox.x - tBox.x;
        const offsetY = sBox.y - tBox.y;

        let mismatchPixels = 0;
        let comparedPixels = 0;
        const threshold = 40;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const sIdx = (y * w + x) * 4;
                const tx = x - offsetX;
                const ty = y - offsetY;

                let tR = 255, tG = 255, tB = 255;
                if (tx >= 0 && tx < w && ty >= 0 && ty < h) {
                    const tIdx = (ty * w + tx) * 4;
                    tR = tData.data[tIdx];
                    tG = tData.data[tIdx+1];
                    tB = tData.data[tIdx+2];
                }

                const sR = sData.data[sIdx];
                const sG = sData.data[sIdx+1];
                const sB = sData.data[sIdx+2];

                // Skip mutual white background
                if (sR > 250 && sG > 250 && sB > 250 && tR > 250 && tG > 250 && tB > 250) continue;

                comparedPixels++;

                if (!lab.checkColor) {
                    const sGray = 0.299*sR + 0.587*sG + 0.114*sB;
                    const tGray = 0.299*tR + 0.587*tG + 0.114*tB;
                    if (Math.abs(sGray - tGray) > threshold) mismatchPixels++;
                } else {
                    if (Math.abs(sR-tR) > threshold || Math.abs(sG-tG) > threshold || Math.abs(sB-tB) > threshold) {
                        mismatchPixels++;
                    }
                }
            }
        }

        if (comparedPixels === 0) comparedPixels = 1;

        const errorPercent = (mismatchPixels / comparedPixels) * 100;
        const passed = errorPercent <= lab.tolerance;

        resultBox.style.display = "block";
        resultBox.className = passed ? "marker-pass" : "marker-fail";
        titleEl.innerText = passed ? "✅ PASSED" : "❌ FAILED";
        detailEl.innerHTML = "Difference: " + errorPercent.toFixed(1) + "%<br>Allowed: " + lab.tolerance + "%";
    }

    window.onload = initLabs;
</script>

</body>
</html>
