<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard | ICT Club Tournament</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="header-label">ICT Club Tournament</div>
        <h1>Scoreboard</h1>
        <div class="header-sub">Results auto-clear 48 hours after logging</div>
    </div>

    <div id="gate" class="mission-brief">
        <div class="mission-title">// Access Required</div>
        <p>Enter the scoreboard password to view results.</p>
        <div class="input-row" style="margin-top:12px; margin-bottom:0;">
            <input type="text" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') loadScoreboard()">
            <button onclick="loadScoreboard()" id="loadBtn">View</button>
        </div>
        <div id="gateStatus" class="status"></div>
    </div>

    <div id="boardWrap" style="display:none;">
        <div class="stats-bar">
            <div class="stat-chip">
                <span class="label">Rows</span>
                <span class="value" id="rowCount">0</span>
            </div>
            <button onclick="loadScoreboard()" style="flex:0 0 auto;">Refresh</button>
        </div>
        <table class="scoreboard-table">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Game</th>
                    <th>Right Attempts</th>
                    <th>Wrong Attempts</th>
                    <th>Solved At (Brisbane)</th>
                </tr>
            </thead>
            <tbody id="boardBody"></tbody>
        </table>
    </div>

    <div class="footer">
        <a href="index.html">Back to Tournament Hub</a>
    </div>

</div>

<script>
    // TODO: replace with your deployed Worker URL
    const WORKER_URL = "https://ictclubtournament.xu-yangen.workers.dev";

    const GAME_TITLES = {
        game1: "1 · The Mine",
        game2: "2 · The Café",
        game3: "3 · The Assistant",
        game4: "4 · The Old Man",
        game5: "5 · The Classroom",
        game6: "6 · The Training Ground"
    };

    async function loadScoreboard() {
        const password = document.getElementById('passwordInput').value.trim();
        const gateStatus = document.getElementById('gateStatus');
        const loadBtn = document.getElementById('loadBtn');

        if (!password) return;

        loadBtn.disabled = true;
        loadBtn.innerText = '...';
        gateStatus.className = 'status';

        try {
            const response = await fetch(`${WORKER_URL}/scoreboard?password=${encodeURIComponent(password)}`);

            if (response.status === 403) {
                gateStatus.className = 'status show incorrect';
                gateStatus.textContent = 'Incorrect password.';
                return;
            }
            if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

            const data = await response.json();
            renderBoard(data.rows || []);

            document.getElementById('gate').style.display = 'none';
            document.getElementById('boardWrap').style.display = 'block';
        } catch (error) {
            gateStatus.className = 'status show incorrect';
            gateStatus.textContent = `Could not load scoreboard: ${error.message}`;
        } finally {
            loadBtn.disabled = false;
            loadBtn.innerText = 'View';
        }
    }

    function renderBoard(rows) {
        const tbody = document.getElementById('boardBody');
        tbody.innerHTML = '';

        rows.sort((a, b) => a.studentName.localeCompare(b.studentName) || a.gameId.localeCompare(b.gameId));

        for (const row of rows) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(row.studentName)}</td>
                <td>${escapeHtml(GAME_TITLES[row.gameId] || row.gameId)}</td>
                <td>${row.rightAttempts}</td>
                <td>${row.wrongAttempts}</td>
                <td class="${row.correctTime ? 'solved' : ''}">${row.correctTime ? escapeHtml(row.correctTime) : '—'}</td>
            `;
            tbody.appendChild(tr);
        }

        document.getElementById('rowCount').textContent = rows.length;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
